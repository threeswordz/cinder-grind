name: M4 PUR07 server Thai PDF proof with ephemeral fonts tools
on:
  push:
    branches: [focused-m4-pur07-unicode-pdftools-20261123]
    paths: ['.github/workflows/focused-m4-pur07-unicode-pdftools-20261123.yml']
permissions:
  contents: read
jobs:
  server-unicode-only:
    name: One new PUR07 server Chromium PDF proof
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_PUR07_UNICODE_SOURCE_SHA: b70043b03b5917c8e537580eb01618745b7c60cf
    steps:
      - name: Checkout exact source and workflow only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Stop unless exact new PDF source is direct parent
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_PUR07_UNICODE_SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pur07-unicode-pdftools-20261123.yml"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate existing Prisma client only
        run: pnpm prisma:generate
      - name: Install Thai test font and PDF text verification tools in disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-core poppler-utils fontconfig
          command -v google-chrome || command -v chromium
          command -v pdftotext
          command -v pdfinfo
          fc-match 'Noto Sans Thai'
      - name: Compile changed Nest API and Unicode service
        run: pnpm --filter @construction-erp/api build
      - name: Exactly two NEW PUR07 Unicode server PDF tests only
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order-unicode-pdf.spec.js
      - name: Explicit scope limits
        run: echo 'No full CI, native legacy PDF, other Chrome suites, Mac, retained user changes, main merge or Production.'
