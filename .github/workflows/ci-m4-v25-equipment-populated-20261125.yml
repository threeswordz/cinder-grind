name: M4 equipment populated database recovery
on:
  push:
    branches: [ci-m4-v25-equipment-populated-20261125]
    paths: ['.github/workflows/ci-m4-v25-equipment-populated-20261125.yml']
permissions:
  contents: read
jobs:
  equipment-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_equipment_upgrade
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_equipment_upgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_equipment_upgrade?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      NODE_ENV: test
      EQUIPMENT_PREDECESSOR: a8e1f688617b5c54656467c61923b6d8e4039007
      EQUIPMENT_SOURCE: 5e3614c76c802cc8ee8a393758691982e52360a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact workflow-only child and local database
        run: |
          test "$(git rev-parse HEAD^)" = "$EQUIPMENT_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/ci-m4-v25-equipment-populated-20261125.yml'
          test "$DATABASE_URL" = 'postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_equipment_upgrade?schema=public'
          test "$M4_NON_PRODUCTION_CONFIRMED" = YES
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Exact source migration preflight
        run: |
          git checkout --detach "$EQUIPMENT_SOURCE"
          node --test deploy/release-candidate/equipment-successor-preflight.test.mjs
          node --check deploy/release-candidate/equipment-successor-populated.mjs
      - name: Populate exact predecessor and verify separate restore
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/equipment-recovery.XXXXXX")"
          trap 'git worktree remove --force "$root/previous" && rm -rf "$root"' EXIT
          git worktree add --detach "$root/previous" "$EQUIPMENT_PREDECESSOR"
          (
            cd "$root/previous"
            test "$(git rev-parse HEAD)" = "$EQUIPMENT_PREDECESSOR"
            pnpm install --frozen-lockfile
            pnpm prisma:generate
            pnpm prisma:migrate:deploy
          )
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          node deploy/release-candidate/equipment-successor-populated.mjs seed "$root/before.json"
          node deploy/release-candidate/equipment-successor-populated.mjs before "$root/before.json"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" pg_dump -U construction_erp -Fc -d erp_m4_equipment_upgrade > "$root/predecessor.dump"
          test -s "$root/predecessor.dump"
          sha256sum "$root/predecessor.dump" > "$root/predecessor.sha256"
          pnpm prisma:migrate:deploy
          pnpm --filter @construction-erp/api exec prisma migrate status
          node deploy/release-candidate/equipment-successor-populated.mjs after "$root/before.json"
          sha256sum --check "$root/predecessor.sha256"
          docker exec "$PG_CONTAINER" createdb -U construction_erp erp_m4_equipment_restore
          docker exec -i "$PG_CONTAINER" pg_restore --exit-on-error --no-owner --no-privileges -U construction_erp -d erp_m4_equipment_restore < "$root/predecessor.dump"
          DATABASE_URL='postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_equipment_restore?schema=public' node deploy/release-candidate/equipment-successor-populated.mjs restored "$root/before.json"
          node deploy/release-candidate/equipment-successor-populated.mjs after "$root/before.json"
      - name: Explicit scope boundary
        run: echo 'Bounded equipment database recovery only; no document recovery, global admission, full CI, retained grants or Production.'
