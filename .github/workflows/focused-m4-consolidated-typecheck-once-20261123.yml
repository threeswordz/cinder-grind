name: M4 consolidated draft new source compatibility compile only
on:
  push:
    branches: [focused-m4-consolidated-typecheck-once-20261123]
    paths: ['.github/workflows/focused-m4-consolidated-typecheck-once-20261123.yml']
permissions:
  contents: read
jobs:
  draft-typecheck-only:
    name: Combined M4 draft Nest and React TypeScript compile ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 13
    env:
      EXACT_M4_CANDIDATE_SHA: 8c60e125b57e1081b552ea8f2de87cdfeddadbf0
    steps:
      - name: Checkout exact combined source with one workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Stop on different candidate or non-workflow changes
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_M4_CANDIDATE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-consolidated-typecheck-once-20261123.yml"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile
      - name: Existing Prisma client generation only
        run: pnpm prisma:generate
      - name: Combined Nest TypeScript compile no tests
        run: pnpm --filter @construction-erp/api build
      - name: Combined React TypeScript check no tests
        run: pnpm --filter @construction-erp/web typecheck
      - name: Limits
        run: echo 'One combined source compatibility compile. No full CI, redundant suites, Mac, retained access, main merge, or Production.'
