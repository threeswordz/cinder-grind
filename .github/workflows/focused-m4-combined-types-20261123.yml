name: M4 combined source API Web typecheck only 2026-11-23
on:
  push:
    branches: [focused-m4-combined-ts-20261123]
    paths: ['.github/workflows/focused-m4-combined-types-20261123.yml']
permissions:
  contents: read
jobs:
  composed-typecheck:
    name: exact-integrated-source-api-web-typecheck
    runs-on: ubuntu-latest
    env:
      EXACT_M4_SOURCE: 515bf2a67664526d424244cabc68d24c6f07ce22
    steps:
      - name: Checkout workflow-only child of integrated M4 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Assert exact integrated source and one workflow-only change
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_M4_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-combined-types-20261123.yml"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Typecheck composed API only
        run: pnpm --filter @construction-erp/api typecheck
      - name: Typecheck composed web only
        run: pnpm --filter @construction-erp/web typecheck
      - name: Evidence limitation
        run: echo 'Composition typecheck only; no repeated feature unit tests, full CI, native DB, browser, Mac, UAT, Production'
