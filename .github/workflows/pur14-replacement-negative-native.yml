name: PUR14 Source Negative Focused Native
on:
  push:
    branches: [ci-pur14-replacement-negatives-20261124]
permissions:
  contents: read
jobs:
  posted-replacement-negatives:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout exact disposable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Assert isolated SHA and GitHub disposable environment
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma and forward-only migrations in fresh PostgreSQL
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Build only affected Nest API TypeScript
        run: pnpm --filter @construction-erp/api build
      - name: Run only expanded PUR14 positive and negative native witness
        run: node --test apps/api/dist/procurement/supplier-replacement-posted.native.integration.spec.js
