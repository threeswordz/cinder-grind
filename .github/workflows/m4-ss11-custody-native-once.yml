# One-time focused migration + SS11 native test. NO release CI, retained data or Production.
name: M4 SS11 Employee Custody Native Only
on:
  push:
    branches: ['work-m4-ss11-native-pg17-once-20261124']
    paths: ['.github/workflows/m4-ss11-custody-native-once.yml']
permissions:
  contents: read
concurrency:
  group: m4-ss11-custody-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ss11-native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      NODE_ENV: test
      RC_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_TEST_SOURCE: ${{ github.sha }}
    steps:
      - name: Checkout exact SS11 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Confirm exact source
        run: test "$(git rev-parse HEAD)" = "$EXACT_TEST_SOURCE"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Install Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Generate and validate Prisma
        run: |
          pnpm prisma:generate
          pnpm prisma:validate
      - name: Deploy forward-only migration on disposable PostgreSQL
        run: pnpm prisma:migrate:deploy
      - name: Check integrated TypeScript and React compile
        run: pnpm typecheck
      - name: Compile new native SS11 test
        run: pnpm --filter @construction-erp/api build
      - name: New-only native SS11 borrower, return, authorization, audit and concurrency
        run: node --test --test-concurrency=1 apps/api/dist/equipment/equipment-custody.integration.spec.js
      - name: Retain no-production boundary
        run: echo 'SS11_NEW_TEST_ONLY; no full release CI, Mac, retained grants, DEC-022, Owner acceptance, or Production'
