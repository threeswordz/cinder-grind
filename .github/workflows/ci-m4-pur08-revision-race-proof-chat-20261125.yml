name: M4 exact successor supplier revision and immutable predecessor proof
on:
  push:
    branches: [ci-m4-pur08-revision-race-proof-chat-20261125]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur10_race
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur10_race"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur10_race?schema=public
      M4_NON_PRODUCTION_CONFIRMED: YES
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Exact isolated source
        run: |
          test "$(git rev-parse HEAD^)" = cd64404a92d172240bfac6efcf3d7df4643d79c8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci-m4-pur08-revision-race-proof-chat-20261125.yml
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur10_race"
          git checkout --detach cd64404a92d172240bfac6efcf3d7df4643d79c8
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Fresh PG17 migrations
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile native API test and owning services
        run: pnpm --filter @construction-erp/api build
      - name: Focused real PG17 PUR10 and PUR08 revision-race native test
        run: node --test apps/api/dist/procurement/purchase-order.pur10-finalization.integration.spec.js
