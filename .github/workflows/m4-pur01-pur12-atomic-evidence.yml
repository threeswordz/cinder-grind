name: M4 PUR01 PUR12 atomic final evidence focused
on:
  push:
    branches: [ci-m4-pur01-pur12-atomic-evidence-20261124]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur12_native
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur12_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur12_native?schema=public
      M4_NON_PRODUCTION_CONFIRMED: YES
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Exact disposable candidate and workflow-only child
        run: |
          test "$(git rev-parse HEAD^)" = 1f8c8cdb34ccb8ae6f4e47897bfd59e303de9929
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-pur01-pur12-atomic-evidence.yml
          test "$DATABASE_URL" = 'postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur12_native?schema=public'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Generate and migrate fresh disposable PostgreSQL
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile affected API
        run: pnpm --filter @construction-erp/api build
      - name: New final quote-policy audit and denial evidence
        run: node --test apps/api/dist/procurement/purchase-order.pur01.integration.spec.js
      - name: New actual MKE TCJ failed-draft sequence rollback
        run: node --test apps/api/dist/procurement/purchase-order.pur12.integration.spec.js
