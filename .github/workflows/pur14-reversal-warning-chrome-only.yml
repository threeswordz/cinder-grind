name: PUR14 Reversal Warning Chrome Only
on:
  push:
    branches: [ci-pur14-reversal-warning-chrome-only-20261124]
permissions:
  contents: read
concurrency:
  group: pur14-reversal-warning-single-chrome-20261124
  cancel-in-progress: true
jobs:
  corrected-store-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      PUR0814_NON_PRODUCTION_CONFIRMED: 'YES'
    steps:
      - name: Checkout exact isolated corrected script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Enforce source SHA/disposable job
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen deps, Prisma, fresh forward-only PG17
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Build affected API for one new Chrome check
        run: |
          pnpm --filter @construction-erp/api build
          node --check deploy/uat/pur14-replacement-browser-native.mjs
          google-chrome --version
      - name: Only CORRECTED real Chrome Store nested-case reversal-warning proof
        run: node deploy/uat/pur14-replacement-browser-native.mjs
      - name: No redundant native or full CI
        run: echo "NATIVE_REVERSAL_ALREADY_PASS_45373701925; CHROME_RENAVIGATION_ONLY; NO_RETAINED_ROLES_OR_DEPLOY"
