name: M4 PUR01 corrected source-only PG guard + new PUR04 checks
on:
  push:
    branches: [focused-m4-pur01-pg-negative-corrected-20261123]
    paths: ['.github/workflows/focused-m4-pur01-pg-negative-corrected-20261123.yml']
permissions:
  contents: read
jobs:
  changed-pg-only:
    name: Only changed PM02 forged-source PG + PUR04 commercial header PG
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur01_corrected
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur01_corrected"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_corrected?schema=public
      EXACT_CORRECTED_SOURCE: b1ba925836a8da850f38f9f2374ee9334eed54c4
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
    steps:
      - name: Checkout exact corrected application and test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Require exact workflow-only child
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_CORRECTED_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pur01-pg-negative-corrected-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_corrected"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and forward-only migrate disposable PG17.11
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Changed API build needed for new native assertion
        run: pnpm --filter @construction-erp/api build
      - name: Only newly corrected PM02 PG source-negative test
        run: node --test --test-concurrency=1 apps/api/dist/procurement/procurement.pm02.integration.spec.js
      - name: Only previously unrun PUR04 commercial header PG test
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order.pur04.integration.spec.js
      - name: Scope
        run: echo 'Corrected negative-path native test + unrun PUR04 only. No full CI, web/pure rerun, Mac, Chrome or Production.'
