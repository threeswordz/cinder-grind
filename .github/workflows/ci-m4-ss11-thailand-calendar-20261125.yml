name: M4 SS11 Thailand custody calendar focused
on:
  push:
    branches: [ci-m4-ss11-thailand-calendar-20261125]
    paths: ['.github/workflows/ci-m4-ss11-thailand-calendar-20261125.yml']
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      M4_NON_PRODUCTION_CONFIRMED: YES
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify exact workflow-only candidate and safe scope
        run: |
          test "$(git rev-parse HEAD^)" = a0ce9bf6307a561e6e56e5f6e68bbc2922eca679
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci-m4-ss11-thailand-calendar-20261125.yml
          test "$M4_NON_PRODUCTION_CONFIRMED" = YES
          git checkout --detach a0ce9bf6307a561e6e56e5f6e68bbc2922eca679
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Compile only affected API and web
        run: |
          pnpm prisma:generate
          pnpm --filter @construction-erp/api build
          pnpm --filter @construction-erp/web typecheck
      - name: Run SS11 boundary and reused SS14 Thailand calendar contracts
        run: |
          node --test apps/api/dist/equipment/equipment-custody-date.spec.js
          node --test apps/api/dist/inventory/approved-plan-start-reminder.spec.js
      - name: Boundary
        run: echo "Pure Thailand date contracts only; no DB, retained actors, changed grants, Production or independent release review."
