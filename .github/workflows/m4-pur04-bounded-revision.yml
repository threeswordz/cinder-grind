name: PUR04 bounded revision focused
on:
  push:
    branches: [ci-m4-pur04-bounded-revision-20261125]
permissions:
  contents: read
jobs:
  header:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur04_bounded
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur04_bounded"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur04_bounded?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify exact isolated source and database
        run: |
          test "$(git rev-parse HEAD^)" = 09ef1561030d8bde9dd4ff9fa9026ee824d2caa3
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-pur04-bounded-revision.yml
          test "$DATABASE_URL" = 'postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur04_bounded?schema=public'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Generate and migrate disposable PostgreSQL
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile bounded API and web
        run: |
          pnpm --filter @construction-erp/api build
          pnpm --filter @construction-erp/web typecheck
      - name: Corrected PM02 seam and new native PUR04 revision and reapproval
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order.pur04-revision.integration.spec.js apps/api/dist/procurement/purchase-order.pm02-source-guard.spec.js
