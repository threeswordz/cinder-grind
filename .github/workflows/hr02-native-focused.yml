name: HR02 focused review UI typecheck
on:
  push:
    branches: ['work-hr02-native-focused-20261129']
permissions:
  contents: read
jobs:
  review-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXACT_CANDIDATE: 993dff1a82b3de07e9d37a826b1a525dbc1aec45
      PRIOR_VERIFIED: 69e4fd5303c87b115e924d5466a8748f3ac87340
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 993dff1a82b3de07e9d37a826b1a525dbc1aec45
          fetch-depth: 0
          persist-credentials: false
      - name: Verify only the review UI changed
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          git merge-base --is-ancestor "$PRIOR_VERIFIED" HEAD
          test "$(git diff --name-only "$PRIOR_VERIFIED" HEAD)" = "apps/web/src/hr/HrWorkspace.tsx"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Typecheck changed web candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter ./apps/web typecheck
      - name: Record focused result
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_CANDIDATE"
          printf '%s\n' "HR02_REVIEW_UI_TYPECHECK_PASS candidate=$EXACT_CANDIDATE fullSuiteExecuted=false browserExecuted=false"
