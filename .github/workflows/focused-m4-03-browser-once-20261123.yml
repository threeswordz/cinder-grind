name: M4-03 FM01 BEN04 PM16 new browser one-shot
on:
  push:
    branches: [focused-m4-03-browser-once-20261123]
    paths: ['.github/workflows/focused-m4-03-browser-once-20261123.yml']
permissions:
  contents: read
jobs:
  new-m4-03-only:
    name: One M4-03 authenticated Chrome Nest Postgres proof
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_fm01_closeout_chromium
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_fm01_closeout_chromium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_fm01_closeout_chromium?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_M4_03_TEST_SOURCE: 2b66f3a292baaf293b65c2f322267d713e6b9805
    steps:
      - name: Checkout exact source with workflow-only test runner child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Stop unless direct workflow-only child of frozen M4-03 test source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_M4_03_TEST_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-03-browser-once-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_fm01_closeout_chromium"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check new browser source and actual Chromium only
        run: |
          node --check deploy/uat/m4-fm01-closeout-browser-native.mjs
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Fresh disposable PG17 forward-only migration
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Build actual Nest API for this new browser journey
        run: pnpm --filter @construction-erp/api build
      - name: ONE new FM01 BEN04 PM16 browser proof, no prior suites
        run: node deploy/uat/m4-fm01-closeout-browser-native.mjs
      - name: Proof limits: new synthetic Chrome only
        run: echo 'No full CI, retained grants, Mac replay, previous Chromium suite, main merge, or Production.'
