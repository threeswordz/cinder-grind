name: M4 PM15 site readback type validation
on:
  push:
    branches: [ci-m4-v25-stock-site-readback-20261125]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Exact isolated source
        run: |
          test "$(git rev-parse HEAD^)" = 0fe545da4241dacb4201f5cad1bcd8d51502a032
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci-m4-v25-stock-site-readback-20261125.yml
          git checkout --detach 0fe545da4241dacb4201f5cad1bcd8d51502a032
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Changed web source typecheck
        run: |
          pnpm prisma:generate
          pnpm --filter @construction-erp/web typecheck
