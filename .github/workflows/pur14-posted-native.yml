name: PUR14 Posted Replacement Focused Native

on:
  push:
    branches: [ci-pur14-replacement-posted-20261124]

permissions:
  contents: read

jobs:
  native-posted-replacement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      NODE_ENV: test
      PUR14_DISPOSABLE_ONLY: YES
    steps:
      - name: Exact source branch checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Verify disposable exact source
        run: |
          test "$PUR14_DISPOSABLE_ONLY" = YES
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and forward-only migrate into fresh PostgreSQL 17.11
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Focused API TypeScript build for new native spec
        run: pnpm --filter @construction-erp/api build
      - name: Run ONLY new actual posted-GR native test
        run: node --test apps/api/dist/procurement/supplier-replacement-posted.native.integration.spec.js
      - name: Run ONLY new supplier replacement pure contract tests
        run: node --test apps/api/src/procurement/supplier-replacement-proof.test.mjs
