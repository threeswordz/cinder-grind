name: M4 reviewed corrected browser one-shot isolated proof
on:
  push:
    branches: [focused-m4-browser-reviewed-20261123]
    paths: ['.github/workflows/focused-m4-browser-reviewed-20261123.yml']
permissions:
  contents: read
jobs:
  browser-reviewed-only:
    name: One reviewed M4 real Chromium + actual API + Postgres proof
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_chromium
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_chromium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_chromium?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_REVIEWED_TEST_SOURCE: 53abc39fbd5ba30064a8144d951e823978ad46ad
    steps:
      - name: Checkout exact independently reviewed source and workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Fail closed unless exactly one workflow-only child of reviewed source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_REVIEWED_TEST_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-browser-reviewed-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_chromium"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check only reviewed browser source and real Chromium availability
        run: |
          node --check deploy/uat/m4-operational-browser-native.mjs
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Prisma generate and forward-only deploy fresh local Postgres
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile real Nest API for browser network only
        run: pnpm --filter @construction-erp/api build
      - name: ONE reviewed focused M4 browser proof — no other test suites
        run: node deploy/uat/m4-operational-browser-native.mjs
      - name: Explicit proof limits
        run: echo 'Real browser, real disposable API/PG operational exceptions only. No full CI, repeated native suites, Mac, Production, merged app or release acceptance.'
