name: M4 PM15 deterministic delayed response browser
on:
  push:
    branches: [ci-m4-pm15-delayed-readback-20261125]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Exact isolated test source
        run: |
          test "$(git rev-parse HEAD^)" = 86015162a1390ff4ee0fa709de16a1fdb1a10d8f
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci-m4-pm15-delayed-readback-20261125.yml
          git checkout --detach 86015162a1390ff4ee0fa709de16a1fdb1a10d8f
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Real Chrome synthetic HTTP delayed-scope regression
        env:
          M4_NON_PRODUCTION_CONFIRMED: 'YES'
        run: |
          node --check deploy/uat/m4-pm15-delayed-site-readback-browser.mjs
          node deploy/uat/m4-pm15-delayed-site-readback-browser.mjs
