# Isolated engineering driver; do not merge into the release branch or main.
name: M8 Receiving and FM03 Targeted Browser Verification
on:
  push:
    branches: ['work-m8-ss16-native-contract-only-20261129']
permissions:
  contents: read
jobs:
  validate:
    name: receiving-fm03-browser-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXACT_REPAIR: '3e0d1ad540798115b082a885f4d1bdc53208e3b7'
      EXACT_BASELINE: '9417f07c609dbc091b5bbe2e09071c5e2c316459'
      RC_NON_PRODUCTION_CONFIRMED: 'YES'
      RC_ENVIRONMENT: ci
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: '3e0d1ad540798115b082a885f4d1bdc53208e3b7'
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Verify exact source and compile API once
        env:
          DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_REPAIR"
          test -z "$(git status --porcelain)"
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm build:api
          node --check deploy/release-candidate/receiving-predecessor.mjs
          node --check deploy/release-candidate/site-issue-predecessor.mjs
          node --test deploy/release-candidate/receiving-contract.test.mjs deploy/release-candidate/site-issue-contract.test.mjs
      - name: Verify only receiving and FM03 populated predecessor browser journeys
        env:
          DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
        run: |
          node deploy/uat/receiving-browser-native.mjs
          node deploy/uat/fm03-browser-native.mjs
          echo M8_RECEIVING_FM03_TARGETED_BROWSER_PASS
