name: PUR14 Canonical Reversal Reconciliation Only
on:
  push:
    branches: [ci-pur14-reversal-read-ui-20261124]
permissions:
  contents: read
concurrency:
  group: pur14-reversal-focused-20261124
  cancel-in-progress: true
jobs:
  native-and-chrome-reversal:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      PUR0814_NON_PRODUCTION_CONFIRMED: 'YES'
      NODE_ENV: test
    steps:
      - name: Checkout source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prove isolated disposable exact source
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Fresh PG17 forward-only migrations and Prisma
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Affected API compile and React typecheck only
        run: |
          pnpm --filter @construction-erp/api build
          pnpm --filter @construction-erp/web typecheck
          node --check deploy/uat/pur14-replacement-browser-native.mjs
      - name: Expanded PUR14 native positive negative actual reversal ONLY
        run: node --test apps/api/dist/procurement/supplier-replacement-posted.native.integration.spec.js
      - name: Actual authenticated Chrome Store warning after GR reversal ONLY
        run: |
          google-chrome --version
          node deploy/uat/pur14-replacement-browser-native.mjs
      - name: Governance
        run: echo "NEW_RECONCILIATION_SOURCE_ONLY; no full CI, retained grants, Production or review approval"
