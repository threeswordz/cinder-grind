name: M4 PM02 actual live authority and immutable correction
on:
  push:
    branches: [ci-m4-pm02-live-authority-chat-20261125]
    paths: ['.github/workflows/ci-m4-pm02-live-authority-chat-20261125.yml']
permissions:
  contents: read
jobs:
  purchasing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pm02_live_authority
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pm02_live_authority"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm02_live_authority?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_SOURCE: a631aa6623a1a3e430f210253cee0db6f750c226
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
      - name: Verify exact source and disposable database
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/ci-m4-pm02-live-authority-chat-20261125.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm02_live_authority"
          git checkout --detach "$EXACT_SOURCE"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Check targeted native authority test
        run: node --check deploy/uat/m4-pm02-live-authority-native.mjs
      - name: Migrate disposable PG17 and compile API
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
          pnpm --filter @construction-erp/api build
      - name: Actual live PM02 authority and correction
        run: node deploy/uat/m4-pm02-live-authority-native.mjs
