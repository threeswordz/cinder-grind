name: BEN04 Closeout Focused Final
on:
  push:
    branches: ['work-m4-ben04-pm16-closeout-no-full-20261123']
    paths: ['.github/workflows/ben04-closeout-focused-once.yml']
permissions:
  contents: read
jobs:
  closeout-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact development source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: BEN04 six-category, warning and signature contract only
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --experimental-strip-types --test deploy/release-candidate/ben04-closeout-contract.test.mjs
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Install workspace dependencies once
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client and typecheck touched API and web
        run: |
          pnpm --filter @construction-erp/api prisma:generate
          pnpm --filter @construction-erp/api typecheck
          pnpm --filter @construction-erp/web typecheck
      - name: Focused scope attestation
        run: echo BEN04_CLOSEOUT_FOCUSED_ONLY_NO_FULL_CI_NO_DB_NO_MAC_NO_PRODUCTION
