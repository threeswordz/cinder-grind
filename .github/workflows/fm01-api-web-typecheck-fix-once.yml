name: FM01 API Web Typecheck Fix Once
on:
  push:
    branches: ['work-fm01-calendar-preview-no-full-20261122']
    paths: ['.github/workflows/fm01-api-web-typecheck-fix-once.yml']
permissions:
  contents: read
jobs:
  fm01-affected-typechecks:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Pin dependencies and regenerate affected API contracts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm install --frozen-lockfile
          pnpm --filter @construction-erp/api prisma:generate
      - name: API and web typecheck only, no repeating 14 passing business tests
        run: |
          pnpm --filter @construction-erp/api typecheck
          pnpm --filter @construction-erp/web typecheck
      - name: Attest narrow check
        run: echo FM01_TYPECHECK_ONLY_NO_FULL_CI_NO_BROWSER_NO_MAC
