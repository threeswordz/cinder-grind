name: FM01 Evidence and Roles Focused Once
on:
  push:
    branches: ['work-fm01-evidence-20261122']
    paths: ['.github/workflows/fm01-evidence-focused-once.yml']
permissions:
  contents: read
jobs:
  fm01-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Execute only FM01 calendar and audit-evidence negative tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --experimental-strip-types --test deploy/release-candidate/fm01-evidence-contract.test.mjs deploy/release-candidate/fm01-workday-preview.test.mjs
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Install workspace dependencies once
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and typecheck touched API and web code
        run: |
          pnpm --filter @construction-erp/api prisma:generate
          pnpm --filter @construction-erp/api typecheck
          pnpm --filter @construction-erp/web typecheck
      - name: Focused boundary attestation
        run: echo FM01_EVENTS_FOCUSED_NO_FULL_CI_NO_DB_NO_MAC_NO_PRODUCTION
