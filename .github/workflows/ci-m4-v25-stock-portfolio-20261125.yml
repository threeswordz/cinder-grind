name: M4 v25 stock minimums and portfolio integration
on:
  push:
    branches: [ci-m4-v25-stock-portfolio-20261125]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pm15_portfolio
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pm15_portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm15_portfolio?schema=public
      M4_NON_PRODUCTION_CONFIRMED: YES
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Exact isolated source
        run: |
          test "$(git rev-parse HEAD^)" = 8e7334866abf31bfdee47f5bc9d90d37a24e8f38
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci-m4-v25-stock-portfolio-20261125.yml
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm15_portfolio"
          git checkout --detach 8e7334866abf31bfdee47f5bc9d90d37a24e8f38
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Fresh PG17 migrations
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile affected API and web
        run: |
          pnpm --filter @construction-erp/api build
          pnpm --filter @construction-erp/web typecheck
      - name: Focused stock minima and advisory contracts
        run: |
          node --test apps/api/dist/inventory/approved-plan-start-reminder.spec.js apps/api/dist/inventory/stock-minimum-contract.spec.js apps/api/dist/inventory/stock-minimum.plan-start.spec.js apps/api/dist/inventory/stock-minimum.service.spec.js apps/api/dist/inventory/stock-minimum.supplier-indicators.spec.js apps/api/dist/inventory/supplier-commitment-indicator.spec.js
      - name: Prepare independent migrated disposable test databases
        run: |
          set -euo pipefail
          export PGPASSWORD=construction_erp_dev_only
          for db in erp_m4_pm15_pending erp_m4_pm15_stock_delivery; do
            psql -h localhost -U construction_erp -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db TEMPLATE erp_m4_pm15_portfolio"
          done
      - name: Actual PM15 work queue, stock delivery and pending source tests
        run: |
          set -euo pipefail
          node --test apps/api/dist/inventory/pm15-portfolio-work-queue.native.integration.spec.js
          DATABASE_URL="postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm15_stock_delivery?schema=public" node --test apps/api/dist/inventory/pm15-portfolio-stock-delivery.native.integration.spec.js
          DATABASE_URL="postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm15_pending?schema=public" node --test apps/api/dist/inventory/pm15-portfolio-pending.native.integration.spec.js
