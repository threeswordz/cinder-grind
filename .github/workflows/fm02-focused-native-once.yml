name: FM02 Focused Native (single candidate gate)
# Explicit Owner authorization 2026-11-22: ONE bounded FM02 native validation.
# The workflow only starts when this workflow file itself is first added/edited
# on the isolated FM02 branch. Later source commits do not retrigger it.
on:
  push:
    branches: ['work-fm02-weighted-progress-no-ci-20261122']
    paths: ['.github/workflows/fm02-focused-native-once.yml']

permissions:
  contents: read

concurrency:
  group: fm02-focused-native-once
  cancel-in-progress: false

jobs:
  fm02-native:
    name: FM02 native only - no full ERP CI
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      FM02_NON_PRODUCTION_ONLY: 'true'
    steps:
      - name: Checkout exact isolated FM02 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Assert branch and exact SHA
        run: |
          test "$GITHUB_REF" = 'refs/heads/work-fm02-weighted-progress-no-ci-20261122'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install locked dependencies and validate Prisma
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm prisma:validate
      - name: Apply forward-only migrations on disposable PostgreSQL 17.11
        run: |
          pnpm prisma:migrate:deploy
          pnpm --filter @construction-erp/api exec prisma migrate status
      - name: Verify FM02 database trigger, constraint and column catalog
        run: |
          pnpm --filter @construction-erp/api exec prisma db execute \
            --file ../../deploy/release-candidate/fm02-native-catalog-assert.sql \
            --schema prisma/schema.prisma
      - name: Compile API including FM02 regression tests
        run: pnpm --filter @construction-erp/api build
      - name: Execute FM02 weighting, Ben authorization and source readback tests ONLY
        run: |
          node --test --test-concurrency=1 \
            apps/api/dist/scheduling/project-progress-weighting.spec.js \
            apps/api/dist/scheduling/project-progress-plan-auth.spec.js \
            apps/api/dist/scheduling/project-progress-plan-readback.spec.js
      - name: Typecheck and build React client
        run: pnpm --filter @construction-erp/web build
      - name: Evidence boundary
        run: |
          echo 'FM02_FOCUSED_NATIVE_ONLY; no full ERP suite, no PR review, no Mac deployment, no production authorization'
