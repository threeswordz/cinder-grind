name: M4 PM02 actual RFQ returned-line denial isolated proof
on:
  push:
    branches: [focused-m4-pm02-rfq-proof-20261123]
    paths: ['.github/workflows/focused-m4-pm02-rfq-proof-20261123.yml']
permissions:
  contents: read
jobs:
  pm02-rfq-only:
    name: PM02 only actual Postgres mixed-line to RFQ and legacy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_pm02_rfq
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_pm02_rfq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_pm02_rfq?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_PM02_SOURCE_SHA: 7c56b949b1a509f47fbefb237c9bfabd8b48f164
    steps:
      - name: Checkout exact PM02 source and workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Fail closed on wrong head or unrelated changes
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_PM02_SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pm02-rfq-proof-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_pm02_rfq"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and forward-only migrate disposable PG17.11
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Focused API build including changed test
        run: pnpm --filter @construction-erp/api build
      - name: Only PM02 actual returned-line RFQ and legacy actor test
        run: node --test --test-concurrency=1 apps/api/dist/procurement/procurement.pm02.integration.spec.js
      - name: Exact limitation
        run: echo 'PM02-only RFQ/source/legacy native proof. No full CI, browser, Mac, Production, merge, or release acceptance.'
