name: PM02 rehearsal evidence contracts focused
on:
  push:
    branches: [ci-m4-pm02-evidence-v21-20261125]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact source and workflow-only delta
        run: |
          test "$(git rev-parse HEAD^)" = eb06de3ed779929459e26fdcac71bc9ef24300d8
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-pm02-evidence-v21.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Check rehearsal and evidence syntax
        run: |
          bash -n deploy/release-candidate/rehearse-migration.sh
          node --check deploy/release-candidate/hr-upgrade.mjs
          node --check deploy/release-candidate/verify-evidence.mjs
      - name: Check v21 evidence and historical compatibility
        run: node --test deploy/release-candidate/verify-evidence.test.mjs deploy/release-candidate/schema-contract.test.mjs deploy/release-candidate/pm02-historical-columns.test.mjs deploy/release-candidate/pm02-schema-preparation.test.mjs
