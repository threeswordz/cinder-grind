name: PUR07 External Document Link Right Focused Only
on:
  push:
    branches: [ci-m4-pur07-document-view-only-20261124]
permissions:
  contents: read
jobs:
  document-link-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Exact disposable branch SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: API TypeScript compile
        run: |
          pnpm prisma:generate
          pnpm --filter @construction-erp/api build
      - name: ONLY new PUR07 document-link negative test
        run: node --test apps/api/dist/procurement/purchase-order-pur07-document-link.spec.js
      - name: Scope boundary
        run: echo "NO other test replays, PostgreSQL, full CI, role grants, supplier send, Production or review approval"
