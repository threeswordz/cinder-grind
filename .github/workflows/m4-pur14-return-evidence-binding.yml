name: PUR14 handover document source binding focused
on:
  push:
    branches: [ci-m4-pur14-return-evidence-binding-20261124]
permissions:
  contents: read
jobs:
  source-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      NODE_ENV: test
    steps:
      - name: Checkout exact isolated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Fail closed on unexpected source or database
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(git rev-parse HEAD^)" = f1af4265c071b5c0988d87ef87be6ee2c810eaac
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-pur14-return-evidence-binding.yml
          test "$DATABASE_URL" = 'postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public'
      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Fresh disposable PG17.11 forward migrations
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile changed API and UI guidance
        run: |
          pnpm --filter @construction-erp/api build
          pnpm --filter @construction-erp/web typecheck
      - name: Only affected custody proof unit tests
        run: node --experimental-strip-types --test apps/api/src/procurement/supplier-return-custody-proof.test.mjs
      - name: Only affected native handover link and duplicate bytes negative proof
        run: node --test apps/api/dist/procurement/supplier-return-custody.native.integration.spec.js
      - name: No repeated full suite or browser replay
        run: echo "Source-specific negative tests only. Historical browser proof remains bounded; no release approval."
