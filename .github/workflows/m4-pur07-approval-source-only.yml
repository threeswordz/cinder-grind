name: PUR07 Approved PDF Completed-Approval Guard Only
on:
  push:
    branches: [ci-m4-pur07-approval-source-only-20261124]
permissions:
  contents: read
jobs:
  one-approved-pdf-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Exact isolated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile only affected Nest API TypeScript
        run: |
          pnpm prisma:generate
          pnpm --filter @construction-erp/api build
      - name: Run ONLY new PUR07 approval-source PDF negative witness
        run: node --test apps/api/dist/procurement/purchase-order-pur07-source-approval.spec.js
      - name: Boundary
        run: echo "NO full suite, PostgreSQL replay, Production, role grants, external supplier messages or merge"
