name: PM09 source-only focused review evidence 2026-11-23
on:
  push:
    branches: [focused-pm09-urgent-docs-20261123]
    paths: ['.github/workflows/focused-pm09-urgent-docs-20261123.yml']
permissions:
  contents: read
jobs:
  pm09-focused:
    name: pm09-policy-tests-and-api-typecheck-only
    runs-on: ubuntu-latest
    env:
      REVIEWED_PM09_SOURCE_SHA: 4d569bcbcc58b7754b4cbcc638d3e7b67488f439
    steps:
      - name: Checkout exact child of PM09 review source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Assert sole workflow change and unchanged PM09 source
        run: |
          test "$(git rev-parse HEAD^)" = "$REVIEWED_PM09_SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-pm09-urgent-docs-20261123.yml"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install exact lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Run PM09 contract negatives only
        run: node --test deploy/release-candidate/pm09-urgent-documents-focused.test.mjs
      - name: Typecheck affected API only
        run: pnpm --filter @construction-erp/api typecheck
      - name: State boundary
        run: echo 'FOCUSED ONLY - not full CI, native DB, browser, recovery, Mac, UAT or Production'
