name: PM02 schema composition focused
on:
  push:
    branches: [ci-m4-pm02-schema-composition-20261125]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact source and workflow-only delta
        run: |
          test "$(git rev-parse HEAD^)" = 5c42d0fca82ec13763b890a5a0b7097a1ad2ffb5
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-pm02-schema-composition.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Check strict schema and migration contracts
        run: node --test deploy/release-candidate/schema-contract.test.mjs deploy/release-candidate/pm02-schema-preparation.test.mjs
