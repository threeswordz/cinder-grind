name: CI393 Live Draft Guard Focused Once
on:
  push:
    branches: ['work-ci393-live-draft-preflight-20261122']
    paths: ['.github/workflows/ci393-live-draft-focused-once.yml']
permissions:
  contents: read
jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Assert exact candidate and test both admission boundaries
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check deploy/release-candidate/ci-candidate-gate.mjs
          node --test deploy/release-candidate/ci-candidate-gate.test.mjs deploy/release-candidate/ci-main-integration.test.mjs deploy/release-candidate/ci-routing-contract.test.mjs
      - name: Limited result attestation
        run: echo CI393_LIVE_DRAFT_GUARD_FOCUSED_NO_FULL_CI_NO_MAC
