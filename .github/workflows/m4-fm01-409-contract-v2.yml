name: M4 FM01 corrected 409 pure contract proof
on:
  push:
    branches: [ci-m4-fm01-409-contract-v2-20261125]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verify exact patched source and one workflow addition
        env:
          SOURCE_SHA: 3e6cc49da653a924babdc8507fb4f60a2335df1d
        run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m4-fm01-409-contract-v2.yml"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: FM01 source, authorization and Serializable guard contract
        run: node --test deploy/release-candidate/fm01-operational-focused.test.mjs deploy/release-candidate/fm01-workday-preview.test.mjs
