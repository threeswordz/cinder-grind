name: M4 PM02 focused Chromium real-UI one-shot
on:
  push:
    branches: [focused-m4-pm02-browser-20261123]
    paths: ['.github/workflows/focused-m4-pm02-browser-20261123.yml']
permissions:
  contents: read
jobs:
  pm02-browser-only:
    name: ONE disposable PG17 + Nest + Vite + Chrome PM02 UI proof
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pm02_chromium
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pm02_chromium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm02_chromium?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_SCOPED_TEST_SOURCE: cb14f8d6364e31cb6a53f494df26eccad4bece24
    steps:
      - name: Checkout only this frozen source and workflow child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Fail closed on any unrelated source or database
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_SCOPED_TEST_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pm02-browser-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pm02_chromium"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Check ONLY the new browser proof and available Chromium
        run: |
          node --check deploy/uat/m4-pm02-purchasing-browser-native.mjs
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Fresh forward-only migrations on ONLY disposable local Postgres
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile actual Nest API
        run: pnpm --filter @construction-erp/api build
      - name: Run ONE new PM02 real authenticated buyer/reviewer browser test
        run: node deploy/uat/m4-pm02-purchasing-browser-native.mjs
      - name: Preserve scope limits
        run: echo 'Focused PM02 browser only. No full CI, completed Chrome replay, Mac, live role grant, production, human UAT or release acceptance.'
