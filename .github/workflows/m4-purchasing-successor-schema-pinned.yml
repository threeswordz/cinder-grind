name: PUR12 PUR07 exact successor preservation contracts
on:
  push:
    branches: [ci-m4-purchasing-successor-schema-pinned-20261125]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify exact source and workflow-only delta
        run: |
          test "$(git rev-parse HEAD^)" = 40727a1e8c629a3152e9f6abe8491cc3b894d611
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-purchasing-successor-schema-pinned.yml
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 24.21.0
      - name: Check exact schema and historical witness contracts
        run: node --test deploy/release-candidate/purchasing-successor-schema-preparation.test.mjs deploy/release-candidate/purchasing-successor-historical.test.mjs
