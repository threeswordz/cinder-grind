name: PUR01 corrected actor fixture type only, same new PG17 test
on:
  push:
    branches: [focused-m4-pur01-actor-type-fixed-20261123]
    paths: ['.github/workflows/focused-m4-pur01-actor-type-fixed-20261123.yml']
permissions:
  contents: read
jobs:
  native-new-only:
    name: Only new PUR01 2-3 supplier and exception test, disposable PG17
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur01_new_actor
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur01_new_actor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_new_actor?schema=public
      EXACT_NEW_ACTOR_SOURCE: 1b06cd9881400af5dcb6046dddb6575da019108d
      NON_PRODUCTION_CONFIRMED: 'YES'
    steps:
      - name: Checkout exact new actor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Fail closed unless workflow-only child and disposable DB
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_NEW_ACTOR_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pur01-actor-type-fixed-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_new_actor"
          test "$NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and apply only forward migrations on disposable PG
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: API build required for new native test only
        run: pnpm --filter @construction-erp/api build
      - name: Run ONLY newly added PUR01 multi-supplier / Ben actor test
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order.pur01.integration.spec.js
      - name: Scope fence
        run: echo 'NEW targeted PUR01 actor proof only. No earlier native tests, web CI, full CI, Mac, Chrome, main or production.'
