name: FM01-A exact weekly browser regression
on:
  push:
    branches: [ci-m4-fm01a-legacy-fixture-20261125]
    paths: ['.github/workflows/m4-fm01a-legacy-fixture.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify workflow-only child
        run: |
          test "$(git rev-parse HEAD^)" = 4aab761d8477cfb63ea978af1444865b720d42d5
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/m4-fm01a-legacy-fixture.yml'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify real Chromium weekly UI in all three languages
        run: node deploy/uat/fm01a-weekly-browser.mjs
