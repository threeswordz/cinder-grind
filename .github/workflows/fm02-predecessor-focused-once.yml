name: FM02 Predecessor Focused Once
# One-time isolated verification of the exact observed receiving CI failure,
# and the identical FM03 predecessor dependency. No full CI or Mac.
on:
  push:
    branches: ['work-fm02-weighted-progress-no-ci-20261122']
    paths: ['.github/workflows/fm02-predecessor-focused-once.yml']
permissions:
  contents: read
concurrency:
  group: fm02-predecessor-focused-once
  cancel-in-progress: false
jobs:
  predecessor:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      VITE_API_BASE_URL: http://localhost:3000/api/v1
    steps:
      - name: Checkout exact isolated candidate and historical migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Confirm isolated source identity
        run: |
          test "$GITHUB_REF" = 'refs/heads/work-fm02-weighted-progress-no-ci-20261122'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Strict historical schema and FM02 predecessor preservation regressions (no install)
        run: |
          node --check deploy/release-candidate/receiving-predecessor.mjs
          node --check deploy/release-candidate/site-issue-predecessor.mjs
          node --test --test-concurrency=1 deploy/release-candidate/schema-contract.test.mjs
      - name: Locked install and Prisma client generation
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
      - name: Build native API once for both browser predecessors
        run: pnpm --filter @construction-erp/api build
      - name: Verify receiving predecessor and real disposable Chromium
        run: node deploy/uat/receiving-browser-native.mjs
      - name: Verify FM03 predecessor and real disposable Chromium
        run: node deploy/uat/fm03-browser-native.mjs
      - name: Evidence boundary
        run: echo 'FM02_PREDECESSOR_FOCUSED_PASS; exact historical upgrade plus receiving and FM03 browser; no full suite, no Mac'
