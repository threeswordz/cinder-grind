name: FM02 HR Historical Contract Focused Once
# No pnpm install, browser, database, Mac or full ERP suite.
on:
  push:
    branches: ['work-fm02-hr-rehearsal-repair-no-ci-20261122']
    paths: ['.github/workflows/fm02-hr-rehearsal-contract-once.yml']
permissions:
  contents: read
jobs:
  fm02-hr-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate and migration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Verify exact source identity
        run: |
          test "$GITHUB_REF" = 'refs/heads/work-fm02-hr-rehearsal-repair-no-ci-20261122'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify HR historical script syntax and exact FM02 regression
        run: |
          node --check deploy/release-candidate/hr-upgrade.mjs
          node --check deploy/release-candidate/hr-fm02-compat.test.mjs
          node --test deploy/release-candidate/hr-fm02-compat.test.mjs
      - name: Focused evidence scope
        run: |
          echo 'FM02_HR_HISTORY_CONTRACT_FOCUSED_PASS: no full CI, no PostgreSQL, no Mac'
