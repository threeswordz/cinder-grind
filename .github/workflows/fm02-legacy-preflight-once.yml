name: FM02 Legacy Preflight Focused Once
on:
  push:
    branches: ['work-fm02-preflight-legacy-contract-20261122']
    paths: ['.github/workflows/fm02-legacy-preflight-once.yml']
permissions:
  contents: read
jobs:
  focused-contract-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Check source identity
        run: |
          test "$GITHUB_REF" = 'refs/heads/work-fm02-preflight-legacy-contract-20261122'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Syntax and one bounded FM02 rehearsal contract suite
        run: |
          node --check deploy/release-candidate/legacy-fixture.mjs
          node --check deploy/release-candidate/hr-upgrade.mjs
          node --check deploy/release-candidate/fm02-legacy-preflight.test.mjs
          bash -n deploy/release-candidate/rehearse-migration.sh
          node --test deploy/release-candidate/fm02-legacy-preflight.test.mjs deploy/release-candidate/hr-fm02-compat.test.mjs
      - name: Focused proof scope
        run: echo 'FM02_LEGACY_ROLLBACK_PREFLIGHT_PASS_NO_FULL_CI_NO_MAC'
