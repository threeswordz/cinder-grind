name: PM09 private source authorization focused final 2026-11-23
on:
  push:
    branches: [focused-pm09-private-doc-guard-20261123]
    paths: ['.github/workflows/focused-pm09-private-doc-guard-20261123.yml']
permissions:
  contents: read
jobs:
  security-focused:
    name: pm09-source-regressions-and-api-typecheck
    runs-on: ubuntu-latest
    env:
      EXACT_PM09_REVIEW_SOURCE: 4350f1ed963dabf2bde8be9eb48de3e2893250c0
    steps:
      - name: Checkout workflow-only child of exact review source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Assert exact PM09 source and no additional change
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_PM09_REVIEW_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-pm09-private-doc-guard-20261123.yml"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Run only PM09 focused source and policy regression
        run: node --test deploy/release-candidate/pm09-urgent-documents-focused.test.mjs
      - name: Typecheck affected API only
        run: pnpm --filter @construction-erp/api typecheck
      - name: Record limit
        run: echo 'FOCUSED ONLY. No full ERP suite, database concurrency, browser, Mac, UAT or Production.'
