name: M4 PM09 Nancy SS13 UI exact-source web typecheck only 2026-11-23
on:
  push:
    branches: [focused-m4-operational-ui-20261123]
    paths: ['.github/workflows/focused-m4-operational-ui-20261123.yml']
permissions:
  contents: read
jobs:
  web-only:
    name: changed-ui-exact-source-typecheck
    runs-on: ubuntu-latest
    env:
      EXACT_REVIEW_UI_SOURCE: 4f349e77905ce9a61c198d968a40fe0c1f113ace
    steps:
      - name: Checkout exact review source with workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Prove source parent and no other changes
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_REVIEW_UI_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-operational-ui-20261123.yml"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma client generation for shared types
        run: pnpm prisma:generate
      - name: Focused Web TypeScript check only
        run: pnpm --filter @construction-erp/web typecheck
      - name: Evidence boundary
        run: echo 'No API/full release CI, feature suites, native PostgreSQL, browser, Mac, human UAT, retained grants or Production'
