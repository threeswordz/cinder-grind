name: M4 disposable authenticated native PostgreSQL only 2026-11-23
on:
  push:
    branches: [focused-m4-native-actor-20261123]
    paths: ['.github/workflows/focused-m4-native-actor-20261123.yml']
permissions:
  contents: read
jobs:
  m4-real-db-http:
    name: M4 Nancy PM09 SS13 disposable native API only
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_native
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_native?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_REVIEWED_SOURCE: 201f09ca77564738a5f07fa661415ba12613a8de
    steps:
      - name: Checkout exact test source with workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Fail closed if parent is not the reviewed M4 source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_REVIEWED_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-native-actor-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_native"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and migrate ephemeral database forward only
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile API and only test-increment TypeScript
        run: pnpm --filter @construction-erp/api build
      - name: Run only three M4 native actor and byte workflows
        run: node --test --test-concurrency=1 apps/api/dist/inventory/m4-operational-native.integration.spec.js
      - name: Explicit evidence boundary
        run: echo 'NATIVE M4 FOCUSED ONLY. Not full ERP CI, not FM01/closeout, not browser, Mac, retained roles, recovery, human UAT, Production or milestone exit.'
