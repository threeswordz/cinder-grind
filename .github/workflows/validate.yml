name: Validate Construction ERP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      API_HOST: 127.0.0.1
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      STORAGE_ROOT: ../../storage
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      BOOTSTRAP_COMPANY_CODE: UATCI
      BOOTSTRAP_COMPANY_NAME: Construction ERP CI UAT
      BOOTSTRAP_ADMIN_EMAIL: uat-ci-admin@example.com
      BOOTSTRAP_ADMIN_DISPLAY_NAME: CI UAT System Administrator
      BOOTSTRAP_ADMIN_PASSWORD: Ci-Uat-Admin-Password-2026!

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate zero-cost UAT pack
        run: |
          bash -n deploy/uat/*.sh
          node --check deploy/uat/serve-web.mjs
          node --check deploy/uat/runtime-acceptance.mjs
      - name: Validate UAT environment template
        run: |
          set -a
          source deploy/uat/.env.example
          set +a
          test "$BOOTSTRAP_COMPANY_NAME" = "Construction ERP UAT"
          test "$BOOTSTRAP_ADMIN_DISPLAY_NAME" = "UAT System Administrator"
      - name: Validate production deployment pack
        run: |
          bash -n deploy/production/*.sh
          node --check deploy/production/load-env.mjs
          node --check deploy/production/validate-env.mjs

          while IFS= read -r -d '' env_key && IFS= read -r -d '' env_value; do
            printf -v "$env_key" '%s' "$env_value"
            export "$env_key"
          done < <(node deploy/production/load-env.mjs deploy/production/.env.example)
          RELEASE_COMMIT="$GITHUB_SHA" node deploy/production/validate-env.mjs

          printf '%s\n' \
            'NODE_ENV=production' \
            'RELEASE_COMMIT=0000000000000000000000000000000000000000' \
            'DEPLOYMENT_MODE=upgrade' \
            'RECOVERY_POINT_VERIFIED=YES' \
            'RECOVERY_POINT_REFERENCE=backup-set-2026-10-06' \
            'API_HOST=127.0.0.1' \
            'API_PORT=3000' \
            'WEB_ORIGIN=https://erp.example.com' \
            'VITE_API_BASE_URL=/api/v1' \
            'DATABASE_URL=postgresql://erp:placeholder@db.example.internal:5432/erp?schema=public' \
            'STORAGE_ROOT="/srv/construction $erp & docs"' \
            > /tmp/production-special.env
          found_storage=false
          while IFS= read -r -d '' env_key && IFS= read -r -d '' env_value; do
            if [[ "$env_key" == "STORAGE_ROOT" && "$env_value" == '/srv/construction $erp & docs' ]]; then found_storage=true; fi
          done < <(node deploy/production/load-env.mjs /tmp/production-special.env)
          [[ "$found_storage" == "true" ]]

          cp /tmp/production-special.env /tmp/production-unsupported.env
          printf '%s\n' 'UNSUPPORTED_PRODUCTION_KEY=must-fail' >> /tmp/production-unsupported.env
          if node deploy/production/load-env.mjs /tmp/production-unsupported.env > /tmp/unsupported-env-output; then
            echo "Unsupported Production environment key unexpectedly passed."
            exit 1
          fi

          for invalid_setting in \
            SESSION_TTL_HOURS=169 \
            LOGIN_RATE_LIMIT_MAX=1001 \
            LOGIN_RATE_LIMIT_WINDOW_MINUTES=1441 \
            DOCUMENT_MAX_FILE_BYTES=2000000001; do
            if env "$invalid_setting" node deploy/production/validate-env.mjs > /tmp/invalid-production-env 2>&1; then
              echo "Out-of-range Production setting unexpectedly passed: $invalid_setting"
              exit 1
            fi
          done

          if WEB_ORIGIN=https://erp.example.com/ node deploy/production/validate-env.mjs > /tmp/noncanonical-origin 2>&1; then
            echo "Non-canonical WEB_ORIGIN unexpectedly passed."
            exit 1
          fi
          if env 'NODE_ENV= production ' node deploy/production/validate-env.mjs > /tmp/padded-node-env 2>&1; then
            echo "Padded Production NODE_ENV unexpectedly passed."
            exit 1
          fi

          for invalid_api_base in \
            'https://api.example.com/api/v1?tenant=x' \
            'https://user@api.example.com/api/v1' \
            'https://api.example.com/api/v1#fragment' \
            'https://api.example.com/api/v1/' \
            'https://api.example.net/api/v1'; do
            if VITE_API_BASE_URL="$invalid_api_base" node deploy/production/validate-env.mjs > /tmp/invalid-api-base 2>&1; then
              echo "Unsafe absolute VITE_API_BASE_URL unexpectedly passed: $invalid_api_base"
              exit 1
            fi
          done

          VITE_API_BASE_URL='https://erp.example.com/api/v1' node deploy/production/validate-env.mjs

          cp deploy/production/.env.example /tmp/production-smoke.env
          sed -i "s/^RELEASE_COMMIT=.*/RELEASE_COMMIT=$GITHUB_SHA/" /tmp/production-smoke.env
          mkdir -p /tmp/v10-smoke-bin
          cat > /tmp/v10-smoke-bin/curl <<'MOCK_CURL'
          #!/usr/bin/env bash
          set -euo pipefail
          output_file=""
          url=""
          while [[ "$#" -gt 0 ]]; do
            case "$1" in
              --output)
                output_file="$2"
                shift 2
                ;;
              --write-out|--proto)
                shift 2
                ;;
              --silent|--show-error)
                shift
                ;;
              *)
                url="$1"
                shift
                ;;
            esac
          done
          if [[ -z "$output_file" || -z "$url" ]]; then
            exit 2
          fi
          if [[ -n "${MOCK_CURL_LOG:-}" ]]; then
            printf '%s\n' "$url" >> "$MOCK_CURL_LOG"
          fi
          if [[ "${MOCK_SMOKE_MODE:-ok}" == "redirect" ]]; then
            printf '%s' 'redirect' > "$output_file"
            printf '302'
            exit 0
          fi
          if [[ "${MOCK_SMOKE_MODE:-ok}" == "bad-health" && "$url" == */api/v1/health ]]; then
            printf '%s' '{"status":"degraded","database":"ok"}' > "$output_file"
            printf '200'
            exit 0
          fi
          if [[ "$url" == */api/v1/health ]]; then
            printf '%s' '{"status":"ok","database":"ok","timestamp":"2026-10-06T00:00:00.000Z"}' > "$output_file"
          else
            printf '%s' '<!doctype html><title>Construction ERP</title>' > "$output_file"
          fi
          printf '200'
          MOCK_CURL
          chmod +x /tmp/v10-smoke-bin/curl

          PATH="/tmp/v10-smoke-bin:$PATH" PRODUCTION_ENV_FILE=/tmp/production-smoke.env bash deploy/production/smoke.sh

          cp /tmp/production-smoke.env /tmp/production-absolute-api.env
          sed -i 's|^VITE_API_BASE_URL=.*|VITE_API_BASE_URL=https://erp.example.com/api/v1|' /tmp/production-absolute-api.env
          : > /tmp/v10-smoke-urls
          PATH="/tmp/v10-smoke-bin:$PATH" MOCK_CURL_LOG=/tmp/v10-smoke-urls PRODUCTION_ENV_FILE=/tmp/production-absolute-api.env bash deploy/production/smoke.sh
          grep -Fxq 'https://erp.example.com/api/v1/health' /tmp/v10-smoke-urls
          grep -Fxq 'https://erp.example.com/' /tmp/v10-smoke-urls

          if PATH="/tmp/v10-smoke-bin:$PATH" MOCK_SMOKE_MODE=redirect PRODUCTION_ENV_FILE=/tmp/production-smoke.env bash deploy/production/smoke.sh; then
            echo "Redirecting Production smoke target unexpectedly passed."
            exit 1
          fi
          if PATH="/tmp/v10-smoke-bin:$PATH" MOCK_SMOKE_MODE=bad-health PRODUCTION_ENV_FILE=/tmp/production-smoke.env bash deploy/production/smoke.sh; then
            echo "Invalid Production health payload unexpectedly passed."
            exit 1
          fi
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Validate Prisma schema
        run: pnpm prisma:validate
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Apply PostgreSQL migrations
        run: pnpm prisma:migrate:deploy
      - name: Verify migration status
        run: pnpm --filter @construction-erp/api exec prisma migrate status
      - name: Validate workspace
        run: pnpm validate
      - name: Bootstrap CI UAT administrator
        run: pnpm --filter @construction-erp/api bootstrap:admin
      - name: Rehearse Production-mode startup restart and unsafe-config failure
        env:
          NODE_ENV: production
          API_HOST: 127.0.0.1
          API_PORT: 3001
          WEB_ORIGIN: https://erp.example.invalid
          STORAGE_ROOT: /tmp/construction-erp-production-documents
        run: |
          mkdir -p "$STORAGE_ROOT"

          start_and_stop() {
            pnpm start:api > /tmp/construction-erp-production-api.log 2>&1 &
            api_pid=$!
            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/health >/dev/null; then
                ready=true
                break
              fi
              if ! kill -0 "$api_pid" >/dev/null 2>&1; then
                echo "Production-mode API exited before becoming healthy."
                cat /tmp/construction-erp-production-api.log
                exit 1
              fi
              sleep 1
            done
            if [[ "$ready" != "true" ]]; then
              echo "Production-mode API did not become healthy."
              cat /tmp/construction-erp-production-api.log
              kill "$api_pid" >/dev/null 2>&1 || true
              exit 1
            fi
            kill "$api_pid"
            wait "$api_pid" || true
          }

          start_and_stop
          start_and_stop

          set +e
          WEB_ORIGIN=http://unsafe.example.invalid timeout 5s pnpm start:api > /tmp/construction-erp-unsafe-production.log 2>&1
          unsafe_status=$?
          set -e
          if [[ "$unsafe_status" -eq 0 || "$unsafe_status" -eq 124 ]]; then
            echo "Unsafe HTTP Production origin did not fail closed."
            cat /tmp/construction-erp-unsafe-production.log
            exit 1
          fi
          grep -q "WEB_ORIGIN must use HTTPS" /tmp/construction-erp-unsafe-production.log
      - name: Smoke API startup and run live acceptance
        run: |
          pnpm start:api > /tmp/construction-erp-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" >/dev/null 2>&1; then
              echo "API exited before becoming healthy."
              cat /tmp/construction-erp-api.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo "API did not become healthy within 30 seconds."
            cat /tmp/construction-erp-api.log
            exit 1
          fi

          echo "API startup smoke passed."
          bash deploy/uat/runtime-acceptance.sh
