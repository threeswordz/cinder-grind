name: Validate Construction ERP

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      API_HOST: 127.0.0.1
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      STORAGE_ROOT: ../../storage
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      BOOTSTRAP_COMPANY_CODE: UATCI
      BOOTSTRAP_COMPANY_NAME: Construction ERP CI UAT
      BOOTSTRAP_ADMIN_EMAIL: uat-ci-admin@example.com
      BOOTSTRAP_ADMIN_DISPLAY_NAME: CI UAT System Administrator
      BOOTSTRAP_ADMIN_PASSWORD: Ci-Uat-Admin-Password-2026!

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate zero-cost UAT pack
        run: |
          bash -n deploy/uat/*.sh
          node --check deploy/uat/serve-web.mjs
          node --check deploy/uat/runtime-acceptance.mjs
      - name: Validate UAT environment template
        run: |
          set -a
          source deploy/uat/.env.example
          set +a
          test "$BOOTSTRAP_COMPANY_NAME" = "Construction ERP UAT"
          test "$BOOTSTRAP_ADMIN_DISPLAY_NAME" = "UAT System Administrator"
      - name: Validate production deployment pack
        run: |
          bash -n deploy/production/*.sh
          node --check deploy/production/load-env.mjs
          node --check deploy/production/validate-env.mjs
          node --check apps/api/scripts/verify-production-target.mjs
          bash -n deploy/recovery/*.sh
          node --check deploy/recovery/manifest.mjs
          node --check deploy/recovery/postgres-url.mjs
          node --check apps/api/scripts/verify-restored-documents.mjs

          while IFS= read -r -d '' env_key && IFS= read -r -d '' env_value; do
            printf -v "$env_key" '%s' "$env_value"
            export "$env_key"
          done < <(node deploy/production/load-env.mjs deploy/production/.env.example)
          export RELEASE_COMMIT="$GITHUB_SHA"
          export RECOVERY_POINT_VERIFIED=YES
          export RECOVERY_POINT_REFERENCE=ci-verified-fresh-empty-state
          node deploy/production/validate-env.mjs

          printf '%s\n' \
            'NODE_ENV=production' \
            "RELEASE_COMMIT=$GITHUB_SHA" \
            'DEPLOYMENT_MODE=upgrade' \
            'UPGRADE_SITE_OFFLINE_CONFIRMED=YES' \
            'RECOVERY_POINT_VERIFIED=YES' \
            'RECOVERY_POINT_REFERENCE=backup-set-2026-10-06' \
            'API_HOST=127.0.0.1' \
            'API_PORT=3000' \
            'WEB_ORIGIN=https://erp.example.com' \
            'VITE_API_BASE_URL=/api/v1' \
            'DATABASE_URL=postgresql://erp:placeholder@db.example.internal:5432/erp?schema=public' \
            'STORAGE_ROOT="/tmp/construction $erp & docs"' \
            'STORAGE_DEPLOYMENT_ID=ci-wrapper' \
            > /tmp/production-special.env
          found_storage=false
          while IFS= read -r -d '' env_key && IFS= read -r -d '' env_value; do
            if [[ "$env_key" == "STORAGE_ROOT" && "$env_value" == '/tmp/construction $erp & docs' ]]; then found_storage=true; fi
          done < <(node deploy/production/load-env.mjs /tmp/production-special.env)
          [[ "$found_storage" == "true" ]]

          # Regression: exercise the documented run-api.sh wrapper itself.
          wrapper_storage='/tmp/construction $erp & docs'
          mkdir -p "$wrapper_storage" /tmp/v10-wrapper-bin
          printf '%s\n' 'construction-erp-production-storage-v1:ci-wrapper' > "$wrapper_storage/.construction-erp-storage-ready"
          printf '%s\n' '#!/usr/bin/env bash' 'exit 0' > /tmp/v10-wrapper-bin/pnpm
          chmod +x /tmp/v10-wrapper-bin/pnpm
          PATH="/tmp/v10-wrapper-bin:$PATH" PRODUCTION_ENV_FILE=/tmp/production-special.env bash deploy/production/run-api.sh

          printf '%s\n' 'construction-erp-production-storage-v1:wrong-deployment' > "$wrapper_storage/.construction-erp-storage-ready"
          if PATH="/tmp/v10-wrapper-bin:$PATH" PRODUCTION_ENV_FILE=/tmp/production-special.env bash deploy/production/run-api.sh > /tmp/wrong-wrapper-storage 2>&1; then
            echo "Production run-api wrapper accepted another deployment's storage sentinel."
            exit 1
          fi
          grep -q 'persistent document storage sentinel is missing or invalid' /tmp/wrong-wrapper-storage
          rm -rf "$wrapper_storage" /tmp/v10-wrapper-bin

          cp /tmp/production-special.env /tmp/production-unsupported.env
          printf '%s\n' 'UNSUPPORTED_PRODUCTION_KEY=must-fail' >> /tmp/production-unsupported.env
          if node deploy/production/load-env.mjs /tmp/production-unsupported.env > /tmp/unsupported-env-output; then
            echo "Unsupported Production environment key unexpectedly passed."
            exit 1
          fi

          if RECOVERY_POINT_VERIFIED=YES RECOVERY_POINT_REFERENCE=replace-with-verified-recovery-point-reference node deploy/production/validate-env.mjs > /tmp/placeholder-recovery-point 2>&1; then
            echo "Placeholder Production recovery point unexpectedly passed."
            exit 1
          fi
          grep -q 'must be replaced with actual verified recovery evidence' /tmp/placeholder-recovery-point

          if DEPLOYMENT_MODE=upgrade UPGRADE_SITE_OFFLINE_CONFIRMED=YES RECOVERY_POINT_VERIFIED=YES RECOVERY_POINT_REFERENCE=fresh-empty-database-and-storage node deploy/production/validate-env.mjs > /tmp/fresh-reference-upgrade 2>&1; then
            echo "Fresh-only recovery reference unexpectedly passed for an upgrade."
            exit 1
          fi
          grep -q 'upgrades require a matching database + Documents recovery-set reference' /tmp/fresh-reference-upgrade

          if DEPLOYMENT_MODE=upgrade UPGRADE_SITE_OFFLINE_CONFIRMED=NO RECOVERY_POINT_VERIFIED=YES RECOVERY_POINT_REFERENCE=ci-verified-upgrade-set node deploy/production/validate-env.mjs > /tmp/unsafe-online-upgrade 2>&1; then
            echo "Production upgrade without offline confirmation unexpectedly passed."
            exit 1
          fi
          grep -q 'UPGRADE_SITE_OFFLINE_CONFIRMED must equal YES' /tmp/unsafe-online-upgrade

          for invalid_setting in \
            SESSION_TTL_HOURS=169 \
            LOGIN_RATE_LIMIT_MAX=1001 \
            LOGIN_RATE_LIMIT_WINDOW_MINUTES=1441 \
            DOCUMENT_MAX_FILE_BYTES=2000000001; do
            if env "$invalid_setting" node deploy/production/validate-env.mjs > /tmp/invalid-production-env 2>&1; then
              echo "Out-of-range Production setting unexpectedly passed: $invalid_setting"
              exit 1
            fi
          done

          if WEB_ORIGIN=https://erp.example.com/ node deploy/production/validate-env.mjs > /tmp/noncanonical-origin 2>&1; then
            echo "Non-canonical WEB_ORIGIN unexpectedly passed."
            exit 1
          fi
          if env 'WEB_ORIGIN= https://erp.example.com ' node deploy/production/validate-env.mjs > /tmp/padded-web-origin 2>&1; then
            echo "Padded Production WEB_ORIGIN unexpectedly passed."
            exit 1
          fi
          if env 'NODE_ENV= production ' node deploy/production/validate-env.mjs > /tmp/padded-node-env 2>&1; then
            echo "Padded Production NODE_ENV unexpectedly passed."
            exit 1
          fi
          if env 'VITE_API_BASE_URL=/api/v1 ' node deploy/production/validate-env.mjs > /tmp/padded-api-base 2>&1; then
            echo "Padded Production VITE_API_BASE_URL unexpectedly passed."
            exit 1
          fi

          # Regression: raw runtime values must fail closed when padded.
          for padded_setting in \
            'API_HOST= 127.0.0.1 ' \
            'API_PORT=3000 ' \
            'DATABASE_URL= postgresql://erp:placeholder@db.example.internal:5432/erp?schema=public ' \
            'STORAGE_ROOT= /srv/construction-erp/documents '; do
            if env "$padded_setting" node deploy/production/validate-env.mjs > /tmp/padded-runtime-value 2>&1; then
              echo "Padded Production runtime setting unexpectedly passed."
              exit 1
            fi
            grep -q 'must not contain surrounding whitespace' /tmp/padded-runtime-value
          done

          for invalid_api_base in \
            'https://api.example.com/api/v1?tenant=x' \
            'https://user@api.example.com/api/v1' \
            'https://api.example.com/api/v1#fragment' \
            'https://api.example.com/api/v1/' \
            'https://api.example.net/api/v1'; do
            if VITE_API_BASE_URL="$invalid_api_base" node deploy/production/validate-env.mjs > /tmp/invalid-api-base 2>&1; then
              echo "Unsafe absolute VITE_API_BASE_URL unexpectedly passed: $invalid_api_base"
              exit 1
            fi
          done

          VITE_API_BASE_URL='https://erp.example.com/api/v1' node deploy/production/validate-env.mjs

          cp deploy/production/.env.example /tmp/production-smoke.env
          sed -i "s/^RELEASE_COMMIT=.*/RELEASE_COMMIT=$GITHUB_SHA/" /tmp/production-smoke.env
          sed -i 's/^RECOVERY_POINT_VERIFIED=.*/RECOVERY_POINT_VERIFIED=YES/' /tmp/production-smoke.env
          sed -i 's/^RECOVERY_POINT_REFERENCE=.*/RECOVERY_POINT_REFERENCE=ci-verified-fresh-empty-state/' /tmp/production-smoke.env
          mkdir -p /tmp/v10-smoke-bin
          cat > /tmp/v10-smoke-bin/curl <<'MOCK_CURL'
          #!/usr/bin/env bash
          set -euo pipefail
          output_file=""
          url=""
          while [[ "$#" -gt 0 ]]; do
            case "$1" in
              --output)
                output_file="$2"
                shift 2
                ;;
              --write-out|--proto)
                shift 2
                ;;
              --silent|--show-error)
                shift
                ;;
              *)
                url="$1"
                shift
                ;;
            esac
          done
          if [[ -z "$output_file" || -z "$url" ]]; then
            exit 2
          fi
          if [[ -n "${MOCK_CURL_LOG:-}" ]]; then
            printf '%s\n' "$url" >> "$MOCK_CURL_LOG"
          fi
          if [[ "${MOCK_SMOKE_MODE:-ok}" == "redirect" ]]; then
            printf '%s' 'redirect' > "$output_file"
            printf '302'
            exit 0
          fi
          if [[ "${MOCK_SMOKE_MODE:-ok}" == "bad-health" && "$url" == */api/v1/health ]]; then
            printf '%s' '{"status":"degraded","database":"ok"}' > "$output_file"
            printf '200'
            exit 0
          fi
          if [[ "$url" == */api/v1/health ]]; then
            printf '%s' '{"status":"ok","database":"ok","timestamp":"2026-10-06T00:00:00.000Z"}' > "$output_file"
          elif [[ "${MOCK_SMOKE_MODE:-ok}" == "bad-web" ]]; then
            printf '%s' '<!doctype html><title>Default Server</title><div>Welcome</div>' > "$output_file"
          else
            printf '%s' '<!doctype html><title>Construction ERP</title><div id="root"></div>' > "$output_file"
          fi
          printf '200'
          MOCK_CURL
          chmod +x /tmp/v10-smoke-bin/curl

          PATH="/tmp/v10-smoke-bin:$PATH" PRODUCTION_ENV_FILE=/tmp/production-smoke.env bash deploy/production/smoke.sh

          cp /tmp/production-smoke.env /tmp/production-absolute-api.env
          sed -i 's|^VITE_API_BASE_URL=.*|VITE_API_BASE_URL=https://erp.example.com/api/v1|' /tmp/production-absolute-api.env
          : > /tmp/v10-smoke-urls
          PATH="/tmp/v10-smoke-bin:$PATH" MOCK_CURL_LOG=/tmp/v10-smoke-urls PRODUCTION_ENV_FILE=/tmp/production-absolute-api.env bash deploy/production/smoke.sh
          grep -Fxq 'https://erp.example.com/api/v1/health' /tmp/v10-smoke-urls
          grep -Fxq 'https://erp.example.com/' /tmp/v10-smoke-urls

          if PATH="/tmp/v10-smoke-bin:$PATH" MOCK_SMOKE_MODE=redirect PRODUCTION_ENV_FILE=/tmp/production-smoke.env bash deploy/production/smoke.sh; then
            echo "Redirecting Production smoke target unexpectedly passed."
            exit 1
          fi
          if PATH="/tmp/v10-smoke-bin:$PATH" MOCK_SMOKE_MODE=bad-health PRODUCTION_ENV_FILE=/tmp/production-smoke.env bash deploy/production/smoke.sh; then
            echo "Invalid Production health payload unexpectedly passed."
            exit 1
          fi
          if PATH="/tmp/v10-smoke-bin:$PATH" MOCK_SMOKE_MODE=bad-web PRODUCTION_ENV_FILE=/tmp/production-smoke.env bash deploy/production/smoke.sh; then
            echo "Default/non-ERP Production web page unexpectedly passed."
            exit 1
          fi
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Validate Prisma schema
        run: pnpm prisma:validate
      - name: Verify fresh Production target database guard
        run: |
          DEPLOYMENT_MODE=fresh node apps/api/scripts/verify-production-target.mjs

          printf '%s\n' 'CREATE TABLE "__v10_nonempty_probe" (id integer);' \
            | pnpm --filter @construction-erp/api exec prisma db execute --stdin --schema prisma/schema.prisma

          set +e
          DEPLOYMENT_MODE=fresh node apps/api/scripts/verify-production-target.mjs \
            > /tmp/v10-fresh-target-guard.log 2>&1
          guard_status=$?
          set -e
          if [[ "$guard_status" -eq 0 ]]; then
            echo "Fresh Production target guard unexpectedly accepted a non-empty database."
            cat /tmp/v10-fresh-target-guard.log
            exit 1
          fi
          grep -q 'DEPLOYMENT_MODE=fresh requires an empty target schema' /tmp/v10-fresh-target-guard.log

          printf '%s\n' 'DROP TABLE "__v10_nonempty_probe";' \
            | pnpm --filter @construction-erp/api exec prisma db execute --stdin --schema prisma/schema.prisma

          DEPLOYMENT_MODE=fresh node apps/api/scripts/verify-production-target.mjs
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Apply PostgreSQL migrations
        run: pnpm prisma:migrate:deploy
      - name: Verify migration status
        run: pnpm --filter @construction-erp/api exec prisma migrate status
      - name: Validate workspace
        run: pnpm validate
      - name: Reset CI state before authenticated recovery fixture
        run: |
          set -euo pipefail

          # The regression suite intentionally creates synthetic Document rows that
          # do not have matching filesystem bytes. Recovery validation must exercise
          # a coherent production-like database + Documents pair, not those test
          # fixtures. Reset only the disposable CI database/storage after the full
          # workspace regression has already passed.
          printf '%s\n' 'DROP SCHEMA IF EXISTS public CASCADE; CREATE SCHEMA public;' \
            | pnpm --filter @construction-erp/api exec prisma db execute --stdin --schema prisma/schema.prisma
          pnpm prisma:migrate:deploy

          rm -rf "$GITHUB_WORKSPACE/storage"
          mkdir -p "$GITHUB_WORKSPACE/storage"
          : > "$GITHUB_WORKSPACE/storage/.gitkeep"
      - name: Bootstrap CI UAT administrator
        run: pnpm --filter @construction-erp/api bootstrap:admin
      - name: Rehearse Production-mode startup restart and unsafe-config failure
        env:
          NODE_ENV: production
          API_HOST: 127.0.0.1
          API_PORT: 3001
          WEB_ORIGIN: https://erp.example.invalid
          STORAGE_ROOT: /tmp/construction-erp-production-documents
          STORAGE_DEPLOYMENT_ID: ci-production
        run: |
          mkdir -p "$STORAGE_ROOT"
          printf '%s\n' 'construction-erp-production-storage-v1:ci-production' > "$STORAGE_ROOT/.construction-erp-storage-ready"

          start_and_stop() {
            pnpm start:api > /tmp/construction-erp-production-api.log 2>&1 &
            api_pid=$!
            ready=false
            for attempt in {1..30}; do
              if curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/health >/dev/null; then
                ready=true
                break
              fi
              if ! kill -0 "$api_pid" >/dev/null 2>&1; then
                echo "Production-mode API exited before becoming healthy."
                cat /tmp/construction-erp-production-api.log
                exit 1
              fi
              sleep 1
            done
            if [[ "$ready" != "true" ]]; then
              echo "Production-mode API did not become healthy."
              cat /tmp/construction-erp-production-api.log
              kill "$api_pid" >/dev/null 2>&1 || true
              exit 1
            fi
            kill "$api_pid"
            wait "$api_pid" || true
          }

          start_and_stop
          start_and_stop

          rm -f "$STORAGE_ROOT/.construction-erp-storage-ready"
          set +e
          timeout 5s pnpm start:api > /tmp/construction-erp-missing-storage.log 2>&1
          missing_storage_status=$?
          set -e
          if [[ "$missing_storage_status" -eq 0 || "$missing_storage_status" -eq 124 ]]; then
            echo "Production API did not fail closed when the persistent storage sentinel was missing."
            cat /tmp/construction-erp-missing-storage.log
            exit 1
          fi
          grep -q 'storage sentinel is missing' /tmp/construction-erp-missing-storage.log
          printf '%s\n' 'construction-erp-production-storage-v1:ci-production' > "$STORAGE_ROOT/.construction-erp-storage-ready"

          set +e
          WEB_ORIGIN=http://unsafe.example.invalid timeout 5s pnpm start:api > /tmp/construction-erp-unsafe-production.log 2>&1
          unsafe_status=$?
          set -e
          if [[ "$unsafe_status" -eq 0 || "$unsafe_status" -eq 124 ]]; then
            echo "Unsafe HTTP Production origin did not fail closed."
            cat /tmp/construction-erp-unsafe-production.log
            exit 1
          fi
          grep -q "WEB_ORIGIN must use HTTPS" /tmp/construction-erp-unsafe-production.log
      - name: Smoke API startup and run live acceptance
        run: |
          pnpm start:api > /tmp/construction-erp-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/health >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$api_pid" >/dev/null 2>&1; then
              echo "API exited before becoming healthy."
              cat /tmp/construction-erp-api.log
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo "API did not become healthy within 30 seconds."
            cat /tmp/construction-erp-api.log
            exit 1
          fi

          echo "API startup smoke passed."
          bash deploy/uat/runtime-acceptance.sh
      - name: Run V1.0-B paired recovery and isolated restore drill
        run: |
          set -euo pipefail

          source_storage="$GITHUB_WORKSPACE/storage"
          mkdir -p "$source_storage"
          printf '%s\n' 'construction-erp-production-storage-v1:ci-recovery' > "$source_storage/.construction-erp-storage-ready"

          cat > /tmp/v10-recovery-source.env <<EOF
          NODE_ENV=production
          RELEASE_COMMIT=$GITHUB_SHA
          DATABASE_URL=$DATABASE_URL
          STORAGE_ROOT=$source_storage
          STORAGE_DEPLOYMENT_ID=ci-recovery
          EOF
          chmod 600 /tmp/v10-recovery-source.env

          mkdir -p /tmp/v10-pg-bin
          cat > /tmp/v10-pg-bin/pg_dump <<'PG_DUMP'
          #!/usr/bin/env bash
          exec docker run --rm --network host postgres:17.11-alpine pg_dump "$@"
          PG_DUMP
          cat > /tmp/v10-pg-bin/pg_restore <<'PG_RESTORE'
          #!/usr/bin/env bash
          exec docker run --rm -i --network host postgres:17.11-alpine pg_restore "$@"
          PG_RESTORE
          cat > /tmp/v10-pg-bin/psql <<'PSQL'
          #!/usr/bin/env bash
          exec docker run --rm --network host postgres:17.11-alpine psql "$@"
          PSQL
          chmod +x /tmp/v10-pg-bin/pg_dump /tmp/v10-pg-bin/pg_restore /tmp/v10-pg-bin/psql
          export PATH="/tmp/v10-pg-bin:$PATH"

          RECOVERY_ROOT=/tmp/v10-recovery-sets \
          RECOVERY_SITE_OFFLINE_CONFIRMED=YES \
          PRODUCTION_ENV_FILE=/tmp/v10-recovery-source.env \
          bash deploy/recovery/create-recovery-set.sh | tee /tmp/v10-recovery-create.log
          recovery_set="$(tail -n 1 /tmp/v10-recovery-create.log)"
          test -d "$recovery_set"
          bash deploy/recovery/verify-recovery-set.sh "$recovery_set"

          admin_url='postgresql://construction_erp:construction_erp_dev_only@localhost:5432/postgres'
          restore_url='postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp_restore?schema=public'
          psql "$admin_url" --no-psqlrc --set=ON_ERROR_STOP=1 --command='CREATE DATABASE construction_erp_restore'

          RESTORE_ENVIRONMENT=drill \
          RESTORE_DATABASE_URL="$restore_url" \
          RESTORE_STORAGE_ROOT=/tmp/v10-restored-documents \
          PRODUCTION_ENV_FILE=/tmp/v10-recovery-source.env \
          bash deploy/recovery/restore-drill.sh "$recovery_set"

          node - "$recovery_set/restore-drill-evidence.json" <<'NODE'
          const { readFileSync } = require('node:fs');
          const evidence = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (evidence.databaseRestore !== 'PASS' ||
              evidence.migrationStatus !== 'PASS' ||
              evidence.documentMetadataContentConsistency !== 'PASS') {
            throw new Error('Restore drill evidence did not record all required PASS gates.');
          }
          if (!Number.isFinite(evidence.durationSeconds) || evidence.durationSeconds > 8 * 60 * 60) {
            throw new Error('Restore drill exceeded the approved 8-hour RTO target.');
          }
          NODE

          ROLLBACK_RELEASE_COMMIT="$GITHUB_SHA" \
          CURRENT_RELEASE_COMMIT="$GITHUB_SHA" \
          PRODUCTION_ENV_FILE=/tmp/v10-recovery-source.env \
          bash deploy/recovery/verify-application-rollback.sh

          DATABASE_URL="$restore_url" \
          STORAGE_ROOT=/tmp/v10-restored-documents \
          NODE_ENV=test \
          API_HOST=127.0.0.1 \
          API_PORT=3002 \
          WEB_ORIGIN=http://localhost:5173 \
          pnpm start:api > /tmp/construction-erp-restored-api.log 2>&1 &
          restored_pid=$!
          cleanup_restored() {
            kill "$restored_pid" >/dev/null 2>&1 || true
          }
          trap cleanup_restored EXIT

          restored_ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3002/api/v1/health >/dev/null; then
              restored_ready=true
              break
            fi
            if ! kill -0 "$restored_pid" >/dev/null 2>&1; then
              echo "Restored API exited before becoming healthy."
              cat /tmp/construction-erp-restored-api.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$restored_ready" != "true" ]]; then
            echo "Restored API did not become healthy."
            cat /tmp/construction-erp-restored-api.log
            exit 1
          fi

          UAT_API_BASE_URL=http://127.0.0.1:3002/api/v1 \
          API_PORT=3002 \
          DATABASE_URL="$restore_url" \
          STORAGE_ROOT=/tmp/v10-restored-documents \
          node deploy/uat/runtime-acceptance.mjs

          echo "V1.0-B isolated recovery drill and authenticated restored-runtime acceptance passed."
