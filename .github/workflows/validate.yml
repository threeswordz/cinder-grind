name: Validate V0.1 skeleton

on:
  pull_request:
    branches: [main]
  push:
    branches: [v0.1-foundation-skeleton]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      STORAGE_ROOT: ../../storage
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Validate Prisma schema
        run: pnpm prisma:validate
      - name: Verify PostgreSQL connectivity and schema
        run: pnpm --filter @construction-erp/api exec prisma db push --skip-generate
      - name: Validate workspace
        run: pnpm validate
