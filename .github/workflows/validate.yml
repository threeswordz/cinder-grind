name: Validate V0.1 skeleton

on:
  pull_request:
    branches: [main]
  push:
    branches: [v0.1-foundation-skeleton]

permissions:
  # Temporary branch-only write permission used once to commit the generated lockfile.
  # This is reverted to read-only immediately after bootstrap.
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      STORAGE_ROOT: ../../storage
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Upload generated pnpm lockfile
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
      - name: Commit deterministic lockfile on bootstrap branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/v0.1-foundation-skeleton'
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Add deterministic pnpm lockfile"
          git push
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Validate Prisma schema
        run: pnpm prisma:validate
      - name: Verify PostgreSQL connectivity and schema
        run: pnpm --filter @construction-erp/api exec prisma db push --skip-generate
      - name: Validate workspace
        run: pnpm validate
