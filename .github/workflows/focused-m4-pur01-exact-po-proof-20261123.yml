name: M4 PUR01 one focused exact PO policy + changed native actor proof
on:
  push:
    branches: [focused-m4-pur01-exact-po-proof-20261123]
    paths: ['.github/workflows/focused-m4-pur01-exact-po-proof-20261123.yml']
permissions:
  contents: read
jobs:
  pur01-only:
    name: PUR01+PUR04+PM02 combined changed-path native PG17.11 proof
    runs-on: ubuntu-latest
    timeout-minutes: 17
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur01
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_PUR01_SOURCE_SHA: ee3ca3e1932a96cf3c37339bbf55ba68ff14f37f
    steps:
      - name: Checkout exact source with workflow-only child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Fail closed on wrong source or extra edits
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_PUR01_SOURCE_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pur01-exact-po-proof-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Pin pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and forward-only migrate DISPOSABLE PG
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: New PUR01/04/PM02 changed-path API build
        run: pnpm --filter @construction-erp/api build
      - name: Changed PUR01/04 Web typecheck
        run: pnpm --filter @construction-erp/web typecheck
      - name: ONLY PUR01 pure threshold edge tests
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order-quote-policy.spec.js
      - name: ONLY integrated changed-source PM02 to PUR01 PO actor
        run: node --test --test-concurrency=1 apps/api/dist/procurement/procurement.pm02.integration.spec.js
      - name: ONLY PUR04 draft header PG source test
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order.pur04.integration.spec.js
      - name: Evidence limits
        run: echo 'Scoped changed code only; not full CI, old Mac, browser, retained people, production, or approval.'
