name: FM02 Evidence Regression Focused Once
on:
  push:
    branches: ['work-fm02-verify-fixture-preflight-20261122']
    paths: ['.github/workflows/fm02-evidence-regression-once.yml']
permissions:
  contents: read
jobs:
  verify-release-contract-tests-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact candidate and predecessor tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Use Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Verify source identity and actual affected proof tests ONLY
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check deploy/release-candidate/verify-evidence.test.mjs
          node --test deploy/release-candidate/verify-evidence.test.mjs deploy/release-candidate/fm02-workflow-evidence-preflight.test.mjs deploy/release-candidate/site-issue-contract.test.mjs deploy/release-candidate/schema-contract.test.mjs
      - name: Focused attestation
        run: echo FM02_EVIDENCE_REGRESSION_FOCUSED_NO_FULL_CI_NO_DB_NO_MAC
