name: M4 PM02 atomic approval source focused
on:
  push:
    branches: [ci-m4-pm02-atomic-source-guard-20261124]
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Exact isolated source and database
        run: |
          test "$(git rev-parse HEAD^)" = e22bfddf18ada568f90d1ec04096164f8f2bd23f
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-pm02-atomic-source-guard.yml
          test "$DATABASE_URL" = 'postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Generate and migrate fresh disposable PostgreSQL
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile changed API
        run: pnpm --filter @construction-erp/api build
      - name: Changed PM02 submit and final approval guard seam
        run: node --test apps/api/dist/procurement/purchase-order.pm02-source-guard.spec.js
      - name: New native approval rollback and affected PO positive path
        run: node --test apps/api/dist/procurement/purchase-order.pur04-revision.integration.spec.js
