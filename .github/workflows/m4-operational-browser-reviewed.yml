name: M4 Reviewed Operational Browser

on:
  push:
    branches:
      - ci-m4-operational-browser-reviewed-0994594e-20261126

permissions:
  contents: read

jobs:
  operational-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_chromium
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_chromium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_chromium?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_SOURCE: 0994594e8ab1fd40d972ade9f463a7cca6e0be32

    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m4-operational-browser-reviewed.yml"
          git checkout --detach "$EXACT_SOURCE"
          test "$(git rev-parse HEAD)" = "$EXACT_SOURCE"
          test "$(git hash-object deploy/uat/m4-operational-browser-native.mjs)" = "be2c525dc8f4b001a3a1c761d23a9ebaf55e0071"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0

      - name: Verify Linux and real Chromium
        run: |
          test "$(uname -s)" = "Linux"
          command -v google-chrome || command -v chromium || command -v chromium-browser
          node --check deploy/uat/m4-operational-browser-native.mjs

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply disposable database migrations
        run: pnpm prisma:migrate:deploy

      - name: Compile API
        run: pnpm build:api

      - name: Execute actual operational browser
        run: node deploy/uat/m4-operational-browser-native.mjs
