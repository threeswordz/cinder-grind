name: M4 PUR07 Unicode NFC Targeted
on:
  push:
    branches: ['work-m4-pur07-unicode-nfc-20261126']
    paths: ['.github/workflows/uom-preserved-native.yml']
permissions:
  contents: read
concurrency:
  group: m4-pur07-pdf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pdf-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      DATABASE_URL: postgresql://invalid:invalid@127.0.0.1:1/erp_m4_no_database
      RC_NON_PRODUCTION_CONFIRMED: 'YES'
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      NODE_ENV: test
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: 709b9d8e6be5d1341a4d26410846eda4ba29bf5e
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install locked dependencies and generate schema
        run: |
          test "$(git rev-parse HEAD)" = "709b9d8e6be5d1341a4d26410846eda4ba29bf5e"
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm prisma:validate
      - name: Build exact API
        run: pnpm --filter @construction-erp/api build
      - name: Prepare real local PDF renderer tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-cjk poppler-utils
          fc-cache -f
      - name: Verify normalized supplier readiness and searchable PDF regression
        run: node --test apps/api/dist/procurement/purchase-order-unicode-pdf.spec.js
      - name: Confirm bounded proof
        run: |
          test "$(git rev-parse HEAD)" = "709b9d8e6be5d1341a4d26410846eda4ba29bf5e"
          echo 'M4_PUR07_UNICODE_NFC_CHROMIUM_PASS'
