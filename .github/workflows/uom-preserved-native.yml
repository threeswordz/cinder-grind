name: M4 Commercial Scope Browser-only Fixture Verification
on:
  push:
    branches: ['work-m4-commercial-scope-browser-only-ci-20261126']
    paths: ['.github/workflows/uom-preserved-native.yml']
permissions:
  contents: read
jobs:
  browser-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c4ae90180248696fab36c24164d10f9a407e308e
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Verify only changed browser fixture against identical runtime
        run: |
          test "$(git rev-parse HEAD)" = "c4ae90180248696fab36c24164d10f9a407e308e"
          pnpm install --frozen-lockfile
          node deploy/uat/m4-protected-cache-denial-browser.mjs
          echo M4_COMMERCIAL_SCOPE_BROWSER_ONLY_TARGETED_PASS
