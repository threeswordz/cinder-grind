name: M4 PO Equipment Security Batch Targeted
on:
  push:
    branches: ['work-m4-po-equipment-security-batch-ci-20261126']
    paths: ['.github/workflows/uom-preserved-native.yml']
permissions:
  contents: read
concurrency:
  group: m4-pur14-document-readback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pur14-document-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_supplier_attribution
          POSTGRES_USER: m4_test
          POSTGRES_PASSWORD: m4_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m4_test -d erp_m4_supplier_attribution"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://m4_test:m4_test_only@127.0.0.1:5432/erp_m4_supplier_attribution?schema=public
      NODE_ENV: test
      STORAGE_ROOT: /tmp/m4-pur14-documents
      RC_NON_PRODUCTION_CONFIRMED: 'YES'
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
    steps:
      - name: Checkout exact correction source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: 2273003f02c1a6edd88746e239f08695cba1981b
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Build isolated source and database
        run: |
          test "$(git rev-parse HEAD)" = "2273003f02c1a6edd88746e239f08695cba1981b"
          mkdir -p "$STORAGE_ROOT"
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm prisma:validate
          pnpm prisma:migrate:deploy
          pnpm --filter @construction-erp/api build
      - name: Verify PO commercial history and delayed submission race
        working-directory: apps/api
        run: |
          node --test --test-concurrency=1 dist/procurement/purchase-order.pur04.integration.spec.js dist/procurement/purchase-order.pur04-revision.integration.spec.js dist/procurement/purchase-order.pur01.integration.spec.js
      - name: Verify actual asset backend live scope on separate disposable database
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U m4_test erp_m4_jai_asset
          export DATABASE_URL='postgresql://m4_test:m4_test_only@127.0.0.1:5432/erp_m4_jai_asset?schema=public'
          pnpm prisma:migrate:deploy
          cd apps/api
          node --test dist/equipment/equipment-asset-register.native.integration.spec.js
      - name: Verify real React and Chromium denied refresh
        run: |
          pnpm --filter @construction-erp/web typecheck
          node deploy/uat/m4-equipment-asset-cache-native.mjs
      - name: Record exact bounded proof
        run: |
          test "$(git rev-parse HEAD)" = "2273003f02c1a6edd88746e239f08695cba1981b"
          echo M4_PO_EQUIPMENT_SECURITY_BATCH_TARGETED_PASS
