name: M4 Document Authorization Batch Targeted
on:
  push:
    branches: ['work-m4-document-security-batch-ci-20261126']
    paths: ['.github/workflows/uom-preserved-native.yml']
permissions:
  contents: read
concurrency:
  group: m4-pur14-document-readback-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pur14-document-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_supplier_attribution
          POSTGRES_USER: m4_test
          POSTGRES_PASSWORD: m4_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m4_test -d erp_m4_supplier_attribution"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://m4_test:m4_test_only@127.0.0.1:5432/erp_m4_supplier_attribution?schema=public
      NODE_ENV: test
      STORAGE_ROOT: /tmp/m4-pur14-documents
      RC_NON_PRODUCTION_CONFIRMED: 'YES'
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
    steps:
      - name: Checkout exact correction source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: 2468adefd0f6a8a14c981a7386dd9b0d91d1b53c
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Build isolated source and database
        run: |
          test "$(git rev-parse HEAD)" = "2468adefd0f6a8a14c981a7386dd9b0d91d1b53c"
          mkdir -p "$STORAGE_ROOT"
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm prisma:validate
          pnpm prisma:migrate:deploy
          pnpm --filter @construction-erp/api build
      - name: Verify native document authorization and supplier lifecycle
        working-directory: apps/api
        run: |
          node --test --test-concurrency=1 dist/procurement/supplier-return-custody.native.integration.spec.js dist/procurement/supplier-delivery-case.native.integration.spec.js dist/procurement/supplier-attribution-boundary.native.integration.spec.js dist/procurement/purchase-order.pur10-finalization.integration.spec.js
      - name: Verify PUR07 document acceptance and current readback in separate disposable database
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U m4_test erp_m4_pur07_native
          export DATABASE_URL='postgresql://m4_test:m4_test_only@127.0.0.1:5432/erp_m4_pur07_native?schema=public'
          pnpm prisma:migrate:deploy
          cd apps/api
          node --test --test-concurrency=1 dist/procurement/purchase-order-pur07-document-link.spec.js dist/procurement/purchase-order-pur07-source-approval.spec.js dist/procurement/purchase-order.pur07.integration.spec.js
      - name: Record exact bounded proof
        run: |
          test "$(git rev-parse HEAD)" = "2468adefd0f6a8a14c981a7386dd9b0d91d1b53c"
          echo M4_DOCUMENT_AUTHORIZATION_BATCH_TARGETED_PASS
