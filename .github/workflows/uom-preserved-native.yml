name: M4 Downstream Fixture Targeted
on:
  push:
    branches: ['work-m4-downstream-fixture-20261126']
    paths: ['.github/workflows/uom-preserved-native.yml']
permissions:
  contents: read
concurrency:
  group: m4-downstream-fixture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  downstream-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      RC_NON_PRODUCTION_CONFIRMED: 'YES'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: 82df55d423aedebf13a642861dc64e30919bad52
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install locked dependencies and generate schema
        run: |
          test "$(git rev-parse HEAD)" = "82df55d423aedebf13a642861dc64e30919bad52"
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm prisma:validate
      - name: Verify affected predecessor and custody contracts
        run: node --test deploy/release-candidate/schema-contract.test.mjs deploy/release-candidate/historical-snapshot.test.mjs deploy/release-candidate/prototype-receiving-upgrade.test.mjs deploy/release-candidate/prototype-uom-upgrade.test.mjs
      - name: Build exact API
        id: build
        run: pnpm --filter @construction-erp/api build
      - name: Verify compiled material artifact custody
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node deploy/uat/prototype-material-artifacts-native.mjs
      - name: Verify receiving on its populated predecessor in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node deploy/uat/receiving-browser-native.mjs
      - name: Verify FM03 on its populated predecessor in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node deploy/uat/fm03-browser-native.mjs
      - name: Verify standalone transfer in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node deploy/uat/transfer-browser-native.mjs
      - name: Verify standalone subcontract in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node deploy/uat/subcontract-physical-browser-native.mjs
      - name: Verify standalone UOM definition in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node deploy/uat/material-uom-browser-native.mjs
      - name: Verify standalone UOM plan in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node deploy/uat/material-uom-browser-native.mjs --stage-c
      - name: Identify exact targeted receipt
        run: |
          test "$(git rev-parse HEAD)" = "82df55d423aedebf13a642861dc64e30919bad52"
          echo 'M4_DOWNSTREAM_FIXTURES_TARGETED_PASS'
