name: FM01 full gate browser timeout isolated diagnosis
on:
  push:
    branches: [ci-fm01-actor-browser-probe-20261125]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      API_HOST: 127.0.0.1
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      STORAGE_ROOT: ../../storage
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      NODE_ENV: test
    steps:
      - name: Checkout source and verify workflow-only change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verify exact PR candidate ancestry and isolated script only
        env:
          SOURCE_SHA: 1b4be1427fea3d729d07a1717f0bfcd6ce232a20
        run: |
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const changed=execFileSync('git',['diff-tree','--no-commit-id','--name-only','-r','HEAD'],{encoding:'utf8'}).trim().split('\n');
          assert.deepEqual(changed,['.github/workflows/fm01-actor-browser-probe.yml']);
          NODE
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies and prepare disposable base database
        run: |
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
          pnpm --filter @construction-erp/api build
      - name: Reproduce only failing actor native+real Chrome check on isolated PostgreSQL
        run: node deploy/uat/prototype-actors-native.mjs
