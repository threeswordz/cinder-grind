name: FM01 Calendar Preview Focused Once
on:
  push:
    branches: ['work-fm01-calendar-preview-no-full-20261122']
    paths: ['.github/workflows/fm01-calendar-focused-once.yml']
permissions:
  contents: read
jobs:
  fm01-focused-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact FM01 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Run isolated calendar and deadline negative cases
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --experimental-strip-types --test deploy/release-candidate/fm01-workday-preview.test.mjs
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Install workspace dependencies once
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and check only affected source type safety
        run: |
          pnpm --filter @construction-erp/api prisma:generate
          pnpm --filter @construction-erp/api typecheck
          pnpm --filter @construction-erp/web typecheck
      - name: Scope attestation
        run: echo FM01_CALENDAR_PREVIEW_FOCUSED_ONLY_NO_POSTGRES_NO_BROWSER_NO_FULL_CI_NO_MAC
