# Single integrated-candidate source-compatibility proof. NOT full release CI or repeat of sealed focused tests.
name: M4 ABCD Exact Integrated Compatibility Only
on:
  push:
    branches: ['focused-m4-abcd-integrated-compat-once-20261124']
    paths: ['.github/workflows/m4-abcd-integrated-compat-once.yml']
permissions:
  contents: read
concurrency:
  group: m4-abcd-compat-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrated-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      M4_REVIEWED_INTEGRATED_SHA: 'b44d789a80b6cf4992d7272eecea36cb6bc6be19'
    steps:
      - name: Checkout exact integrated source plus one workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Assert only this workflow differs from the exact Draft integration
        run: |
          test "$(git rev-parse HEAD^)" = "$M4_REVIEWED_INTEGRATED_SHA"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/m4-abcd-integrated-compat-once.yml"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate and schema validate only
        run: |
          pnpm prisma:generate
          pnpm prisma:validate
      - name: Full workspace TypeScript compatibility, not full release CI
        run: pnpm typecheck
      - name: Compile integrated API including custody and supplier indicators
        run: pnpm --filter @construction-erp/api build
      - name: Guarded eight-role operator syntax, not real browser
        run: |
          node --check deploy/uat/m4-eight-role-journeys-20261124.mjs
          node --check deploy/uat/m4-eight-role-journeys-20261124.test.mjs
      - name: Preserve bounded evidence label
        run: echo 'INTEGRATED_SOURCE_COMPAT_ONLY; no repeated native tests, no Chrome/retained grants/DEC-022/Owner #384/full CI/Production'
