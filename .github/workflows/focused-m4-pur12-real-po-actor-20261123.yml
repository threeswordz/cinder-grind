name: M4 PUR12 NEW native MKE/TCJ PO real-actor proof
on:
  push:
    branches: [focused-m4-pur12-real-po-actor-20261123]
    paths: ['.github/workflows/focused-m4-pur12-real-po-actor-20261123.yml']
permissions:
  contents: read
jobs:
  pur12-native-only:
    name: One real disposable PG17 PUR12 create/revision/SQL negative
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur12_native
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur12_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur12_native?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_PUR12_SOURCE: f74a2bbb14cb49047edf3510066c3e4a4f024ebe
    steps:
      - name: Checkout one frozen new native test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Refuse unexpected parent, file, or DB
        run: |
          test "$(git rev-parse HEAD^)" = "$EXACT_PUR12_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pur12-real-po-actor-20261123.yml"
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur12_native"
          test "$M4_NON_PRODUCTION_CONFIRMED" = "YES"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Fresh isolated forward-only migration and generated Prisma
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile changed real native actor source
        run: pnpm --filter @construction-erp/api build
      - name: ONLY the NEW PUR12 MKE/TCJ actual PO actor and SQL denial
        run: node --test apps/api/dist/procurement/purchase-order.pur12.integration.spec.js
      - name: Explicit evidence boundary
        run: echo 'PUR12 native actor only; no prior PUR01/PM02 suite, Web or browser, Mac, release CI, retained grants or production.'
