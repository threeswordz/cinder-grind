name: M4 v25 FM01 integrated weekly site and closeout
on:
  push:
    branches: [ci-m4-v25-fm01-integrated-20261125]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_fm01_closeout_chromium
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_fm01_closeout_chromium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_fm01_closeout_chromium?schema=public
      M4_NON_PRODUCTION_CONFIRMED: YES
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Exact isolated source
        run: |
          test "$(git rev-parse HEAD^)" = f45139f9e4f20b2104314f8deb1cfea253c6ca34
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ci-m4-v25-fm01-integrated-20261125.yml
          test "${DATABASE_URL%%\?*}" = "postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_fm01_closeout_chromium"
          git checkout --detach f45139f9e4f20b2104314f8deb1cfea253c6ca34
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Fresh PG17 migrations
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile affected API and web
        run: |
          pnpm --filter @construction-erp/api build
          pnpm --filter @construction-erp/web typecheck
      - name: Focused FM01 policy and summary contracts
        run: |
          node --test deploy/release-candidate/fm01-operational-focused.test.mjs deploy/release-candidate/fm01-workday-preview.test.mjs apps/api/dist/site-execution/site-weekly-summary.spec.js
      - name: Actual FM01 and closeout integrated authenticated browser
        run: node deploy/uat/m4-fm01-closeout-browser-native.mjs
