name: M4 PUR07 only new Thai CDP Page.printToPDF approval proof
on:
  push:
    branches: [focused-m4-pur07-chrome-cdp-20261123]
    paths: ['.github/workflows/focused-m4-pur07-chrome-cdp-20261123.yml']
permissions:
  contents: read
jobs:
  actual-thai-po-pdf-only:
    name: Only real Chrome Thai PDF export via proven CDP pipe, no full suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUR07_DISPOSABLE_BROWSER_ONLY: 'YES'
      EXPECTED_PUR07_SOURCE: 9460eaee3dd0ecd897cc027421ac6b0aedcaf0c3
    steps:
      - name: Exact developer source and no unrelated changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Source and non-Production scope guard
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PUR07_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-m4-pur07-chrome-cdp-20261123.yml"
          test "$PUR07_DISPOSABLE_BROWSER_ONLY" = "YES"
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Ensure ephemeral Thai font and PDF text inspector
        run: |
          if [ -z "$(fc-list :lang=th -f '%{family}\\n')" ] || ! command -v pdftotext >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-thai-tlwg poppler-utils
          fi
          fc-list :lang=th -f '%{family}\\n' > /tmp/pur07-thai-families.txt
          test -s /tmp/pur07-thai-families.txt
          command -v pdftotext
          command -v pdfinfo
          (command -v google-chrome || command -v chromium || command -v chromium-browser)
      - name: Typecheck ONLY affected Web app graph
        run: pnpm --filter @construction-erp/web typecheck
      - name: One NEW real Chromium CDP Thai A4 PDF test
        run: node deploy/uat/pur07-thai-approved-po-print-browser.mjs
      - name: Explicit no-waste evidence boundary
        run: echo 'Real Chrome Page.printToPDF Thai glyph and exact totals on fake approved PO only. Not full CI, native PG, previous browser suite, Mac, or Production.'
