name: SS13 loss case source-only focused 2026-11-23
on:
  push:
    branches: [focused-ss13-causal-uom-20261123]
    paths: ['.github/workflows/focused-ss13-causal-uom-20261123.yml']
permissions:
  contents: read
jobs:
  focused-source:
    name: ss13-contract-negative-and-api-typecheck-only
    runs-on: ubuntu-latest
    env:
      SS13_REVIEW_SOURCE: e4945ca8a8dd4aee748cca8db1040274bd091868
    steps:
      - name: Checkout exact SS13 source child
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verify no change other than this isolated focused workflow
        run: |
          test "$(git rev-parse HEAD^)" = "$SS13_REVIEW_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/focused-ss13-causal-uom-20261123.yml"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install exact lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Run only SS13 contract and audit negatives
        run: node --test deploy/release-candidate/ss13-loss-damage-focused.test.mjs
      - name: Typecheck affected API
        run: pnpm --filter @construction-erp/api typecheck
      - name: Record strict evidence limit
        run: echo 'FOCUSED ONLY; not full ERP CI, native PostgreSQL, protected file bytes, browser, Mac or Production.'
