# Focused STORE UI typecheck only. Earlier API/PG/7 pure policy checks already passed.
name: PUR08-PUR14 Store Receiving React Typecheck
on:
  push:
    branches: ['ci-pur08-pur14-focused-20261124']
    paths:
      - '.github/workflows/pur08-pur14-focused.yml'
      - 'apps/web/src/inventory/InventoryWorkspace.tsx'
      - 'apps/web/src/inventory/ReceivingPanel.tsx'
      - 'apps/web/src/procurement/SupplierDeliveryCasePanel.tsx'
permissions:
  contents: read
concurrency:
  group: pur08-pur14-one-targeted-20261124
  cancel-in-progress: true
jobs:
  store-react-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prove exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused React TypeScript check (Store receiving entry)
        run: pnpm --filter @construction-erp/web typecheck
      - name: Reuse prior passing native and pure checks
        run: echo "No repeated API, PostgreSQL, policy, or full release CI tests"
