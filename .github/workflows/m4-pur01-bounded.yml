name: PUR01 bounded whole-PO comparison focused
on:
  push:
    branches: [ci-m4-pur01-bounded-20261125]
permissions:
  contents: read
jobs:
  header:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur01_bounded
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur01_bounded"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_bounded?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify exact isolated source and database
        run: |
          test "$(git rev-parse HEAD^)" = b6159797267ce1aa5bf2153c4cb568917725bcbf
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/m4-pur01-bounded.yml
          test "$DATABASE_URL" = 'postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_bounded?schema=public'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - run: pnpm install --frozen-lockfile
      - name: Generate and migrate disposable PostgreSQL
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate:deploy
      - name: Compile bounded API and web
        run: |
          pnpm --filter @construction-erp/api build
          pnpm --filter @construction-erp/web typecheck
      - name: PUR01 native threshold and final audit plus changed PM02 integration
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order-quote-policy.spec.js apps/api/dist/procurement/purchase-order.pur01.integration.spec.js apps/api/dist/procurement/procurement.pm02.integration.spec.js apps/api/dist/procurement/purchase-order.pm02-source-guard.spec.js
