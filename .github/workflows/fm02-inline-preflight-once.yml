name: FM02 Inline Evidence Preflight Only
on:
  push:
    branches: ['work-fm02-preflight-workflow-20261122']
    paths: ['.github/workflows/fm02-inline-preflight-once.yml']
permissions:
  contents: read
jobs:
  inline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout actual full Git predecessor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Assert exact source identity
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Execute seven real inline evidence consumers and negative cases
        run: |
          node --check deploy/release-candidate/fm02-workflow-evidence-preflight.test.mjs
          node --test deploy/release-candidate/fm02-workflow-evidence-preflight.test.mjs
      - name: Limited preflight proof
        run: echo FM02_INLINE_VERSION20_PREFLIGHT_ONLY_NO_FULL_CI_NO_MAC
