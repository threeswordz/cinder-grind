# One-off PUR10 isolated Postgres 17.11 source/run proof; NOT full PR/main release CI.
name: M4 PUR10 Corrected Targeted Native PostgreSQL
on:
  push:
    branches: ['work-m4-pur10-native-fixed-once-20261124']
    paths: ['.github/workflows/m4-pur10-native-once.yml']
permissions:
  contents: read
concurrency:
  group: pur10-native-once-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pur10-native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: construction_erp
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U construction_erp -d construction_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/construction_erp?schema=public
      NODE_ENV: test
      RC_NON_PRODUCTION_CONFIRMED: 'YES'
      EXACT_PUR10_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout only reviewed PUR10 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact source identity
        run: test "$(git rev-parse HEAD)" = "$EXACT_PUR10_COMMIT"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and generate Prisma client
        run: |
          pnpm prisma:generate
          pnpm prisma:validate
      - name: Apply only ordered migrations to disposable PostgreSQL
        run: pnpm prisma:migrate:deploy
      - name: Compile exact API and new native test
        run: pnpm --filter @construction-erp/api build
      - name: Run NEW PUR10 native PostgreSQL integration test only
        run: node --test --test-concurrency=1 apps/api/dist/procurement/purchase-order.pur10-finalization.integration.spec.js
      - name: Record focused-only boundary
        run: echo 'PUR10_NATIVE_ONLY - not full PR/main validation, retained MKE/TCJ user test, Mac, UAT, reviewed release or Production'
