name: M4 PUR01 populated predecessor recovery proof
on:
  push:
    branches: [ci-m4-pur01-populated-restore-20261125]
    paths: ['.github/workflows/m4-pur01-populated-restore.yml']
permissions:
  contents: read
jobs:
  pur01-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: erp_m4_pur01_upgrade
          POSTGRES_USER: construction_erp
          POSTGRES_PASSWORD: construction_erp_dev_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U construction_erp -d erp_m4_pur01_upgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_upgrade?schema=public
      M4_NON_PRODUCTION_CONFIRMED: 'YES'
      NODE_ENV: test
      PUR01_PREDECESSOR: f9b4feadf1b0641621a489082c2ca2224df789cd
      PUR01_SOURCE: cde0237679608074da07f7ef32f611c9ea158d77
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify exact workflow-only child and local database
        run: |
          test "$(git rev-parse HEAD^)" = "$PUR01_SOURCE"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/m4-pur01-populated-restore.yml'
          test "$DATABASE_URL" = 'postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_upgrade?schema=public'
          test "$M4_NON_PRODUCTION_CONFIRMED" = YES
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Strict additive schema and original migration blob proof
        run: node --test deploy/release-candidate/pur01-schema-preparation.test.mjs
      - name: Populate exact predecessor and prove all rows survive only the PUR01 forward migration
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/pur01-upgrade.XXXXXX")"
          trap 'git worktree remove --force "$root/previous" && rm -rf "$root"' EXIT
          git worktree add --detach "$root/previous" "$PUR01_PREDECESSOR"
          (
            cd "$root/previous"
            test "$(git rev-parse HEAD)" = "$PUR01_PREDECESSOR"
            pnpm install --frozen-lockfile
            pnpm prisma:generate
            pnpm prisma:migrate:deploy
            pnpm --filter @construction-erp/api build
            # Existing native journeys are used solely to create real historical
            # mixed approved/returned PR metadata, PO, receipt, audit and stock fixture records.
            node --test --test-concurrency=1 apps/api/dist/procurement/procurement.pm02.integration.spec.js apps/api/dist/procurement/purchase-order.integration.spec.js apps/api/dist/procurement/purchase-order.pur04-revision.integration.spec.js
          )
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          node deploy/release-candidate/pur01-populated-upgrade-preparation.mjs before "$root/before.json"
          test -n "$PG_CONTAINER"
          # Same PG17 service supplies client binaries; backup before upgrade.
          docker exec "$PG_CONTAINER" pg_dump -U construction_erp -Fc -d erp_m4_pur01_upgrade > "$root/predecessor.dump"
          test -s "$root/predecessor.dump"
          sha256sum "$root/predecessor.dump" > "$root/predecessor.sha256"
          pnpm prisma:migrate:deploy
          pnpm --filter @construction-erp/api exec prisma migrate status
          node deploy/release-candidate/pur01-populated-upgrade-preparation.mjs after "$root/before.json"
          sha256sum --check "$root/predecessor.sha256"
          docker exec "$PG_CONTAINER" createdb -U construction_erp erp_m4_pur01_predecessor_restore
          docker exec -i "$PG_CONTAINER" pg_restore --exit-on-error --no-owner --no-privileges -U construction_erp -d erp_m4_pur01_predecessor_restore < "$root/predecessor.dump"
          DATABASE_URL='postgresql://construction_erp:construction_erp_dev_only@localhost:5432/erp_m4_pur01_predecessor_restore?schema=public' node deploy/release-candidate/pur01-populated-upgrade-preparation.mjs restored "$root/before.json"
          # Confirm forward target remains intact after independent restore.
          node deploy/release-candidate/pur01-populated-upgrade-preparation.mjs after "$root/before.json"
      - name: Explicit scope boundary
        run: echo 'PUR01 populated upgrade and separate predecessor DB restore only; no document-store recovery, global rehearsal admission change, full CI, independent review, retained data, UAT or Production.'
