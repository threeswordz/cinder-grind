services:
  postgres:
    image: docker.io/library/postgres:17.11-alpine
    environment:
      POSTGRES_DB: construction_erp
      POSTGRES_USER: construction_erp
      POSTGRES_PASSWORD: construction_erp_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - construction_erp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction_erp -d construction_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  construction_erp_postgres:
