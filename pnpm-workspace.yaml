packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 blocks dependency build scripts by default.
# Only the pinned Prisma packages required by our approved ORM are allowed.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

# Temporary security override for GHSA-ggr8-5vv4-36mx / CVE-2026-40345.
# Remove once the selected Prisma line consumes deepmerge-ts >= 8.0.0 upstream.
overrides:
  deepmerge-ts: 8.0.2
